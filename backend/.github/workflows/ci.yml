name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          args: --timeout=5m

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck ./...

      - name: deadcode
        run: go run golang.org/x/tools/cmd/deadcode -test ./...

      - name: file size check
        run: go run ./tools/check-file-lines --strict

      - name: handler registry audit
        run: bash ../scripts/check_handler_registry.sh

      - name: unit tests
        run: go test -short -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: eslint
        run: npx eslint src/ --max-warnings 0

      - name: tsc
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - uses: bufbuild/buf-lint-action@v1

      - uses: bufbuild/buf-breaking-action@v1
        with:
          against: "https://github.com/${{ github.repository }}.git#branch=main"
