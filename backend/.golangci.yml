version: "2"
run:
  tests: false
linters:
  enable:
    - bodyclose
    - forbidigo
    - funlen
    - gocognit
    - goconst
    - gocyclo
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Tx).Commit
        - (github.com/ClickHouse/clickhouse-go/v2/lib/driver.Batch).Abort
        - (io.Writer).Write
        - (github.com/ClickHouse/clickhouse-go/v2/lib/driver.Batch).Send
        - (connectrpc.com/connect.Stream).Send
        - (*alphaforge/internal/trace.Tracer).Shutdown
        - (*go.opentelemetry.io/otel/sdk/trace.TracerProvider).Shutdown
        - os.MkdirAll
        - os.Rename
        - encoding/json.Unmarshal
        - fmt.Sscanf
        - crypto/rand.Read
        - (*go.uber.org/zap.Logger).Sync
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Exec
        - (net/http.ResponseWriter).Write
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: use clock.Now() instead of time.Now() (M10-BASE-A5)
        - pattern: ^time\.Sleep$
          msg: use clock.Sleep() instead of time.Sleep() (M10-BASE-A5)
        - pattern: ^time\.NewTicker$
          msg: use clock.NewTicker() instead of time.NewTicker() (M10-BASE-A5)
        - pattern: ^time\.NewTimer$
          msg: use clock.NewTimer() instead of time.NewTimer() (M10-BASE-A5)
        - pattern: ^time\.AfterFunc$
          msg: use clock.AfterFunc() instead of time.AfterFunc() (M10-BASE-A5)
      exclude-godoc-examples: false
    funlen:
      lines: 120
      statements: 75
    gocognit:
      min-complexity: 35
    goconst:
      min-occurrences: 5
    gocyclo:
      min-complexity: 30
    gosec:
      excludes:
        - G115
        - G404
        - G101
        - G402
    revive:
      rules:
        - name: argument-limit
          arguments:
            - 10
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
        path: backend/internal/model/models\.go
      - linters:
          - forbidigo
        path: internal/clock/
      - linters:
          - errcheck
          - forbidigo
          - staticcheck
        path: cmd/
      - linters:
          - errcheck
          - forbidigo
        path: internal/connect/
      - linters:
          - forbidigo
        path: internal/marketplace/
      - linters:
          - errcheck
          - forbidigo
        path: internal/model/
      - linters:
          - forbidigo
        path: internal/dataquality/
      - linters:
          - forbidigo
        path: internal/strategy/
      - linters:
          - forbidigo
        path: internal/tenant/
      - linters:
          - forbidigo
        path: internal/repository/
      - linters:
          - forbidigo
        path: internal/service/
      - linters:
          - forbidigo
        path: internal/marketstate/
      - linters:
          - forbidigo
        path: internal/controlplane/
      - linters:
          - forbidigo
        path: internal/ai/
      - linters:
          - forbidigo
        path: pkg/faultisol/
      - linters:
          - forbidigo
        path: internal/pkg/jwt/
      - linters:
          - forbidigo
        path: tools/mql2go/
      - linters:
          - gocognit
        path: internal/risksvc/jurisdiction\.go
      - linters:
          - funlen
          - gocognit
          - gocyclo
        path: internal/connect/stream_handler\.go
      - linters:
          - funlen
          - gocognit
        path: cmd/server/main\.go
      - linters:
          - funlen
        path: internal/mdgateway/runner\.go
      - linters:
          - funlen
        path: internal/connect/schedule_health_handler\.go
      - linters:
          - funlen
        path: internal/mdgateway/adapter/mt4/
      - linters:
          - funlen
        path: internal/mdgateway/adapter/mt5/
      - linters:
          - funlen
          - gocyclo
        path: internal/factor/dsl/compile\.go
      - linters:
          - forbidigo
        path: _test\.go$
      - linters:
          - staticcheck
        path: internal/mdgateway/adapter/mt4/
      - linters:
          - staticcheck
        path: internal/mdgateway/adapter/mt5/
      - linters:
          - staticcheck
        path: internal/mthub/
      - linters:
          - staticcheck
        path: internal/secrets/vault_legacy\.go
      - linters:
          - unparam
        path: internal/mdgateway/spill_replay\.go
      - linters:
          - unparam
        path: internal/repository/admin_repo_users\.go
      - linters:
          - unparam
        path: internal/qualitygate/backtest_gate\.go
      - linters:
          - unparam
        path: pkg/logger/logger\.go
      - linters:
          - unparam
        path: internal/mdgateway/manager\.go
      - linters:
          - unparam
        path: internal/factor/dsl/parser\.go
      - linters:
          - unused
        path: internal/mdgateway/quality\.go
    paths:
      - .*\.pb\.go$
      - .*_grpc\.pb\.go$
      - .*const.*\.go$
      - backend/gen
      - backend/mt4
      - backend/mt5
      - frontend
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
