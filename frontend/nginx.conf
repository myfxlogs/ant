worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Docker built-in DNS — avoids stale upstream IP on container restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'" always;

        # Proxy /api/* and /sse/* to backend (auth, SRE, SSE streaming)
        location /api/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            add_header Cache-Control "no-store, no-transform";
        }

        location /sse/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Never cache index.html — ensures fresh JS bundle references after deploy
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files /index.html =404;
        }

        # SEO: Serve prerendered HTML for crawler bots on public routes
        location = / {
            if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|semrushbot|ahrefsbot)) {
                rewrite ^ /landing.html last;
            }
            try_files /index.html =404;
        }
        location = /login {
            if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|semrushbot|ahrefsbot)) {
                rewrite ^ /login.html last;
            }
            try_files /index.html =404;
        }
        location = /register {
            if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|semrushbot|ahrefsbot)) {
                rewrite ^ /register.html last;
            }
            try_files /index.html =404;
        }
        location = /marketplace {
            if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|semrushbot|ahrefsbot)) {
                rewrite ^ /marketplace.html last;
            }
            try_files /index.html =404;
        }

        # Umami analytics reverse proxy
        location /umami/ {
            rewrite ^/umami/(.*)$ /$1 break;
            proxy_pass http://umami:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 4h;
            add_header Cache-Control "public, max-age=14400";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ConnectRPC v2 — proxies /ant.v1.* to backend (streaming, Cloudflare-tunnel aware)
        location ~ ^/ant\.v1\. {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            # Prevent Cloudflare from gzip-compressing binary proto responses.
            # Browsers send Accept-Encoding: gzip, and Cloudflare compresses
            # application/proto responses. Some fetch() implementations don't
            # auto-decompress streaming responses, causing "premature EOF".
            proxy_set_header Accept-Encoding "identity";
            # Cloudflare/HTTP2 compatibility: response headers to prevent buffering
            # and signal streaming to Cloudflare Tunnel.
            add_header X-Accel-Buffering no;
            add_header Cache-Control "no-store, no-transform";
            proxy_set_header X-Accel-Buffering no;
        }

        # Legacy v1 API — backwards compatibility
        location ~ ^/alphaforge(\.|/|$) {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Status page — uptime-kuma
        location /status/ {
            set $kuma_upstream uptime-kuma:3001;
            proxy_pass http://$kuma_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Prometheus metrics — proxy to backend with identity encoding
        location = /metrics {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "identity";
            proxy_buffering off;
        }

        # Prometheus — metrics query UI
        location /prometheus/ {
            set $prom_upstream prometheus:9090;
            proxy_pass http://$prom_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # AlertManager — alert management UI
        location /alertmanager/ {
            set $am_upstream alertmanager:9093;
            proxy_pass http://$am_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
