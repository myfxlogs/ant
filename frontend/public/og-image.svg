  <text x="110" y="122" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#0d1117" text-anchor="middle">ΛF</text>
  <text x="160" y="120" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#D4AF37">AlphaForge</text>
