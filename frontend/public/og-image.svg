  <text x="80" y="370" font-family="Arial,sans-serif" font-size="24" fill="#8b949e">Backtest · Optimize · Deploy · Auto-Trade</text>
  <!-- Feature pills -->
  <rect x="80" y="420" width="180" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
