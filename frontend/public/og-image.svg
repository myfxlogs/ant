  <rect x="460" y="420" width="180" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
  <text x="550" y="448" font-family="Arial,sans-serif" font-size="16" fill="#c9d1d9" text-anchor="middle">Automated Trading</text>
  <rect x="660" y="420" width="160" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
  <text x="740" y="448" font-family="Arial,sans-serif" font-size="16" fill="#c9d1d9" text-anchor="middle">Risk Management</text>
