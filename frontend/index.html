        <h1>AlphaForge — AI-Powered MT4/MT5 Strategy Backtesting &amp; Auto-Trading Platform</h1>
        <p>AlphaForge is an AI-powered platform for MT4/MT5 strategy backtesting, optimization, and automated trading. Create, test, and deploy trading strategies with built-in indicators, risk management, and live execution.</p>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Strategy Backtesting</strong> — Backtest MQL4/MQL5 strategies on historical data with realistic execution assumptions, commission modeling, and slippage simulation.</li>
          <li><strong>AI Optimization</strong> — Leverage AI to optimize strategy parameters, analyze performance, and suggest improvements.</li>
          <li><strong>Automated Trading</strong> — Deploy strategies to live MT4/MT5 accounts with real-time monitoring and automatic execution.</li>
          <li><strong>Risk Management</strong> — Built-in risk controls including max drawdown limits, position sizing, and trade direction filters.</li>
          <li><strong>Strategy Marketplace</strong> — Browse, purchase, and deploy trading strategies created by other traders.</li>
          <li><strong>Performance Analytics</strong> — Comprehensive analytics including equity curves, monthly breakdowns, win rates, Sharpe ratio, and trade-by-trade analysis.</li>
          <li><strong>Multi-Account Management</strong> — Connect and manage multiple MT4/MT5 accounts from a single dashboard.</li>
          <li><strong>Real-Time Streaming</strong> — Live price feeds, position updates, and account metrics via SSE streaming.</li>
        </ul>

        <h2>Supported Platforms</h2>
        <p>AlphaForge supports both MetaTrader 4 (MT4) and MetaTrader 5 (MT5) platforms, with full MQL4 and MQL5 strategy compatibility. Connect your existing broker accounts or create new ones.</p>

        <h2>Getting Started</h2>
        <p>Create a free account to start building, backtesting, and deploying your trading strategies. No credit card required.</p>
