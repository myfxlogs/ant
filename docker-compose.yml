services:
  frontend:
    container_name: alphaforge-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MENU_MODE: ${VITE_MENU_MODE:-full}
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-docker.io/library/node:22-alpine}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_STREAM_URL: ${VITE_STREAM_URL:-}
    image: alphaforge-prod-frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${ANT_FRONTEND_PORT:-8022}:8080"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaforge-network

  backend:
    container_name: alphaforge-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alphaforge-prod-backend
    restart: always
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-ant}
      - DB_USER=${DB_USER:-ant}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (32+ chars)}
      - NATS_URL=nats://${NATS_USER:-ant}:${NATS_PASSWORD:-ant}@nats:4222
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      - ANT_MASTER_KEY=${ANT_MASTER_KEY}
      - TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      - TRONSCAN_API_KEY=${TRONSCAN_API_KEY:-}
      - DEPOSIT_XPUB_FINGERPRINT=${DEPOSIT_XPUB_FINGERPRINT:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphaforge-network

  postgres:
    container_name: alphaforge-postgres
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    environment:
      - POSTGRES_USER=${DB_USER:-ant}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-ant}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ant} -d ${DB_NAME:-ant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaforge-network

  redis:
    container_name: alphaforge-redis
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaforge-network

  nats:
    container_name: alphaforge-nats
    image: nats:2.10-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 48M
    command: ["-c", "/etc/nats/nats.conf", "-js"]
    environment:
      - NATS_USER=${NATS_USER:-ant}
      - NATS_PASSWORD=${NATS_PASSWORD:-ant}
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_HTTP_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alphaforge-network

  umami:
    container_name: alphaforge-umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ant}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-ant}_umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET must be set in .env (32+ chars)}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - alphaforge-network

  prometheus:
    container_name: alphaforge-prometheus
    image: prom/prometheus:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 48M
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    networks:
      - alphaforge-network

  alertmanager:
    container_name: alphaforge-alertmanager
    image: prom/alertmanager:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - alphaforge-network

networks:
  alphaforge-network:
    driver: bridge

volumes:
  postgres_data:
    name: ant_postgres_data
  redis_data:
    name: ant_redis_data
  nats_data:
    name: ant_nats_data
  prometheus_data:
    name: alphaforge_prometheus_data
  alertmanager_data:
    name: alphaforge_alertmanager_data