groups:
- name: backend-runtime
  rules:
  - alert: BackendDown
    expr: up{job="alphaforge-backend"} == 0
    for: 30s
    labels:
      severity: page
    annotations:
      summary: "Backend is down"

  - alert: HighGoroutineCount
    expr: go_goroutines > 500
    for: 5m
    annotations:
      summary: "Goroutine count > 500 ({{ $value }})"

  - alert: HighMemoryUsage
    expr: go_memstats_heap_inuse_bytes / go_memstats_sys_bytes > 0.85
    for: 5m
    annotations:
      summary: "Heap usage > 85% of sys memory"

  - alert: HighGCPause
    expr: histogram_quantile(0.99, rate(go_gc_duration_seconds_bucket[5m])) > 0.1
    for: 5m
    annotations:
      summary: "GC p99 > 100ms"

- name: market-data
  rules:
  - alert: MDSpillBacklog
    expr: md_spill_pending_files > 0
    for: 5m
    annotations:
      summary: "Spill backlog > 5min ({{ $value }} files)"

  - alert: MDClockSkewHigh
    expr: md_clock_skew_max_seconds > 30
    for: 2m
    annotations:
      summary: "Clock skew > 30s"

  - alert: MDGapExceeded
    expr: rate(md_gap_exceeded_total[5m]) > 1
    for: 5m
    annotations:
      summary: "Gap exceeded > 1/s"

  - alert: MDDLQSpike
    expr: rate(md_dlq_sampled_total{reason="parse_error"}[5m]) > 1
    for: 2m
    annotations:
      summary: "DLQ parse_error spike — broker corrupting data"

  - alert: MDStaleAccounts
    expr: md_stale_accounts > 0
    for: 10m
    annotations:
      summary: "{{ $value }} stale market data accounts"

  - alert: MDDeadAccounts
    expr: md_dead_accounts > 0
    for: 10m
    annotations:
      summary: "{{ $value }} dead market data accounts"

  - alert: MDSpreadAnomaly
    expr: rate(md_spread_anomaly_total[5m]) > 0.1
    for: 5m
    annotations:
      summary: "Spread anomaly rate > 0.1/s"

- name: strategy
  rules:
  - alert: SignalDropped
    expr: rate(signal_dropped_total[5m]) > 0
    for: 1m
    labels:
      severity: page
    annotations:
      summary: "Signals being dropped — possible data loss"

  - alert: BacktestFailureRate
    expr: rate(ant_strategy_backtest_runs_total{status="failed"}[10m])
        / rate(ant_strategy_backtest_runs_total[10m]) > 0.3
    for: 10m
    annotations:
      summary: "Backtest failure rate > 30%"

- name: infrastructure
  rules:
  - alert: PostgresDown
    expr: up{job="postgres"} == 0
    for: 30s
    labels:
      severity: page
    annotations:
      summary: "PostgreSQL is down"

  - alert: RedisDown
    expr: up{job="redis"} == 0
    for: 30s
    labels:
      severity: page
    annotations:
      summary: "Redis is down"
