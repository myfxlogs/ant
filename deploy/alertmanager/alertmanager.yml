global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

receivers:
  - name: "default"
    # No external notification configured — alerts visible in AlertManager UI only.
    # To add email/slack, add webhook_configs or email_configs here.
