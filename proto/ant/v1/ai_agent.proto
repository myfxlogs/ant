syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

// AgentDefinitionService manages per-user AI agent definitions.
service AgentDefinitionService {
  rpc BatchSetAgents(BatchSetAgentsRequest) returns (BatchSetAgentsResponse);
  rpc ListAgentDefs(ListAgentDefsRequest) returns (ListAgentDefsResponse);
}

message AIAgentDefinition {
  string id = 1;
  string agent_key = 2;
  string type = 3;
  string name = 4;
  string identity = 5;
  string input_hint = 6;
  bool enabled = 7;
  int32 position = 8;
  string provider_id = 9;
  string model_override = 10;
}

message AgentDefEntry {
  string agent_key = 1;
  string type = 2;
  string name = 3;
  string identity = 4;
  string input_hint = 5;
  bool enabled = 6;
  int32 position = 7;
  string provider_id = 8;
  string model_override = 9;
}

message BatchSetAgentsRequest {
  repeated AgentDefEntry agents = 1;
}

message BatchSetAgentsResponse {
  bool success = 1;
}

message ListAgentDefsRequest {}

message ListAgentDefsResponse {
  repeated AIAgentDefinition agents = 1;
}

// Compatibility aliases for ai.proto ListAgents RPC.
message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AIAgentDefinition agents = 1;
}

