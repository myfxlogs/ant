syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "google/protobuf/timestamp.proto";
import "parameter_entry.proto";

message StrategyTemplate {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  string code = 5;
  repeated TemplateParameter parameters = 6;
  bool is_public = 7;
  repeated string tags = 8;
  int32 use_count = 9;
  string status = 12;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bool is_system = 13;
  // I18n data for parameter labels.
  TemplateI18n i18n = 14;
  // FK to imported_strategies.id (ADR-0023: MQL source of truth).
  string strategy_id = 15;
}

message TemplateParameter {
  string name = 1;
  string type = 2;
  string default = 3;
  string min = 4;
  string max = 5;
  string step = 6;
  string label = 7;
  string description = 8;
  repeated string options = 9;
}

// StrategyCard is a denormalized card for Gallery display (ADR-0027).
// Aggregates template metadata + latest successful backtest KPIs + running schedule count.
message StrategyCard {
  string id = 1;                    // template id
  string user_id = 2;               // template owner user id
  string name = 3;
  string description = 4;
  repeated string tags = 5;
  bool is_system = 6;
  bool is_public = 7;
  int32 use_count = 8;
  google.protobuf.Timestamp created_at = 9;
  // Sparkline: equity curve from the latest successful backtest (decimal strings).
  repeated string sparkline = 10;
  // KPIs from the latest successful backtest (decimal strings for precision).
  string win_rate = 11;
  string max_drawdown = 12;
  string profit_factor = 13;
  string sharpe_ratio = 14;
  // Count of active schedules for this template.
  int32 running_schedules = 15;
  // ID of the backtest run that produced the sparkline/KPIs (empty if none).
  string backtest_run_id = 16;
}

// TemplateI18n holds parameter label translations per locale.
message TemplateI18n {
  // Map of locale code → (param name → translated label)
  map<string, ParamLabelMap> locales = 1;
}
