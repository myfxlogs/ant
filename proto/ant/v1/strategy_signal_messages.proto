syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "google/protobuf/timestamp.proto";

message ListSignalsRequest {
  string account_id = 1;
  string status = 2;
}

message ListSignalsResponse {
  repeated StrategySignal signals = 1;
}

message StrategySignal {
  string id = 1;
  string strategy_id = 2;
  string account_id = 3;
  string symbol = 4;
  string signal_type = 5;
  string volume = 6;
  string price = 7;
  string stop_loss = 8;
  string take_profit = 9;
  string reason = 10;
  string status = 11;
  int64 executed_ticket = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp executed_at = 14;
  // VM-TRADE-CONTEXT-3/4: fields required for complete signal contract.
  int32 magic = 15;             // EA-configured magic number (0 = use schedule magic)
  int32 deviation = 16;         // EA-configured deviation (0 = use default)
  int64 opposite_ticket = 17;   // for CloseBy: the opposite position ticket
}

message ExecuteSignalRequest {
  string signal_id = 1;
}

message ExecuteSignalResponse {
  int64 ticket = 1;
  string symbol = 2;
  string type = 3;
  string volume = 4;
  string price = 5;
  google.protobuf.Timestamp executed_at = 6;
}

message ConfirmSignalRequest {
  string signal_id = 1;
}

message CancelSignalRequest {
  string signal_id = 1;
}
