syntax = "proto3";

package ant.v1;

option go_package = "anttrader/gen/proto/ant/v1;antv1";

// StrategyImportService — MQL 策略导入与分析。
// 前端上传 MQL 源码 → 分析报告 → 用户确认参数 → 生成 Python 策略代码。
service StrategyImportService {
  // 分析 MQL 源码，返回策略意图摘要 + 参数面板 schema + 盲区报告。
  rpc AnalyzeCode(AnalyzeCodeRequest) returns (AnalyzeCodeResponse);

  // 生成 Python 策略代码（基于分析结果，应用用户参数覆盖）。
  rpc GenerateCode(GenerateCodeRequest) returns (GenerateCodeResponse);

  // 完整导入：分析 → 用户确认 → 生成 → 存储策略。
  rpc ImportStrategy(ImportStrategyRequest) returns (ImportStrategyResponse);
}

// ── AnalyzeCode ──────────────────────────────────────────────────

message AnalyzeCodeRequest {
  string source_code = 1;      // MQL 源码
  string source_name = 2;      // 文件名，如 "simple_ma_cross.mq4"
  string source_lang = 3;      // "mql4" | "mql5"
}

message AnalyzeCodeResponse {
  // 策略元信息
  string strategy_name = 1;
  string mql_version = 2;      // "mql4" | "mql5"

  // 导入完整度
  double coverage_score = 10;   // 0.0–1.0
  int32 total_blocks = 11;
  int32 recognized_blocks = 12;

  // 参数面板 schema
  repeated ParamField params = 20;
  repeated ParamGroupInfo groups = 21;

  // 执行模型
  string execution_kind = 30;   // "on_bar" | "on_tick" | "on_init_grid"

  // 策略分析报告（盲区）
  repeated BlindSpotItem blind_spots = 40;

  // 意图摘要
  int32 entry_rules_count = 50;
  int32 exit_rules_count = 51;
  string sizing_kind = 52;      // "fixed" | "martingale"
  int32 risk_checks_count = 53;

  // 识别的指标名称
  repeated string indicator_names = 60;
}

message ParamField {
  string name = 1;
  string label = 2;
  string param_type = 3;        // "number" | "text" | "switch" | "select"
  string default_value = 4;
  string group = 5;             // e.g. "入场参数"
  int32 group_order = 6;
  // Number fields
  optional double min = 10;
  optional double max = 11;
  optional double step = 12;
  // Select fields
  repeated ParamOption options = 20;
}

message ParamOption {
  string value = 1;
  string label = 2;
}

message ParamGroupInfo {
  string name = 1;
  string label = 2;
  int32 order = 3;
  int32 field_count = 4;
}

message BlindSpotItem {
  string id = 1;
  string location = 2;          // 源码位置，如 "on_tick:L45-L78"
  string category = 3;          // 分类，如 "未识别的入场逻辑"
  string severity = 4;          // "致命" | "警告" | "信息"
  string description = 5;       // 人类可读描述
  string handling = 6;          // 系统处理方式
  bool user_action_required = 7;
}

// ── GenerateCode ─────────────────────────────────────────────────

message GenerateCodeRequest {
  string source_code = 1;
  string source_name = 2;
  string source_lang = 3;
  // 用户覆写的参数值 (key = param_name)
  map<string, string> param_overrides = 10;
}

message GenerateCodeResponse {
  string python_code = 1;
  int32 code_lines = 2;
  bool compiles = 3;
  repeated string quality_gate_failures = 10;
}

// ── ImportStrategy ───────────────────────────────────────────────

message ImportStrategyRequest {
  string source_code = 1;
  string source_name = 2;
  string source_lang = 3;
  // 用户确认的参数值
  map<string, string> param_overrides = 10;
  // 保存到工作区
  optional string workspace_id = 20;
}

message ImportStrategyResponse {
  string strategy_id = 1;
  string strategy_name = 2;
  string python_code = 3;
  double coverage_score = 4;
  repeated BlindSpotItem blind_spots = 10;
}
