syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "google/protobuf/timestamp.proto";

message ProfitUpdateEvent { string account_id = 1; string balance = 2; string credit = 3; string profit = 4; string equity = 5; string margin = 6; string free_margin = 7; string margin_level = 8; repeated OrderProfitItem orders = 9; double profit_percent = 10; }
message UserSummaryEvent { string total_balance = 1; string total_equity = 2; string total_profit = 3; int32 account_count = 4; int32 connected_count = 5; google.protobuf.Timestamp updated_at = 6; string pnl_today = 7; string pnl_week = 8; string pnl_month = 9; int32 trades_today = 10; int32 trades_week = 11; int32 trades_month = 12; double win_rate = 13; double profit_factor = 14; double max_drawdown_percent = 15; int32 max_consecutive_wins = 16; int32 max_consecutive_losses = 17; }
message OrderProfitItem { int64 ticket = 1; string symbol = 2; string profit = 3; string volume = 4; string current_price = 5; }
message AccountStatusEvent { string account_id = 1; string status = 2; string message = 3; }
message StrategyExecutionEvent { string strategy_id = 1; string account_id = 2; string symbol = 3; string action = 4; string status = 5; string message = 6; }
message RiskAlertEvent { string account_id = 1; string alert_type = 2; string message = 3; string value = 4; string threshold = 5; }
