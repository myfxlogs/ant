syntax = "proto3";
package ant.v1;
option go_package = "alphaforge/gen/proto/ant/v1;antv1";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "backtest_execution_config.proto";
import "backtest_run_query.proto";

service MarketplaceService {
  rpc PublishStrategy(PublishStrategyRequest) returns (PublishStrategyResponse);
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
  rpc PurchaseStrategy(PurchaseStrategyRequest) returns (PurchaseStrategyResponse);
  rpc ListPublished(ListPublishedRequest) returns (ListPublishedResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // Rating & comments
  rpc RateStrategy(RateStrategyRequest) returns (RateStrategyResponse);
  rpc ListRatings(ListRatingsRequest) returns (ListRatingsResponse);
  rpc CommentOnStrategy(CommentOnStrategyRequest) returns (CommentOnStrategyResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // Admin
  rpc SetStrategyPricing(SetStrategyPricingRequest) returns (SetStrategyPricingResponse);
  // Unpublish — author or admin can hide a strategy from the marketplace.
  rpc UnpublishStrategy(UnpublishMarketStrategyRequest) returns (UnpublishMarketStrategyResponse);
  // Publisher dashboard stats.
  rpc GetPublisherStats(GetPublisherStatsRequest) returns (GetPublisherStatsResponse);
  // Backtest — runs backtest for a marketplace-published strategy.
  // Strategy code is resolved server-side; client never sees it.
  // Returns a server stream of BacktestRunUpdate for real-time progress.
  rpc RunMarketBacktest(RunMarketBacktestRequest) returns (stream BacktestRunUpdate);
  // Live performance tracking
  rpc GetLivePerformance(GetLivePerformanceRequest) returns (GetLivePerformanceResponse);
  rpc LinkLiveAccount(LinkLiveAccountRequest) returns (LinkLiveAccountResponse);
  // Phase 2: AI strategy generation → compile → backtest → quality gate → auto-publish.
  // Streams progress events through all stages.
  rpc GenerateAndPublish(GenerateAndPublishRequest) returns (stream GenerateAndPublishEvent);
  // Phase 2: Generate from a parameter template.
  rpc GenerateFromTemplate(GenerateFromTemplateRequest) returns (stream GenerateAndPublishEvent);
  // Phase 2: List available strategy parameter templates.
  rpc ListStrategyTemplates(ListStrategyTemplatesRequest) returns (ListStrategyTemplatesResponse);
  // Phase 2 Admin: List auto-generation tasks.
  rpc ListAutoGenTasks(ListAutoGenTasksRequest) returns (ListAutoGenTasksResponse);
  // Phase 2 Admin: Approve an auto-generated task → publish to marketplace.
  rpc ApproveAutoGenTask(ApproveAutoGenTaskRequest) returns (ApproveAutoGenTaskResponse);
  // Phase 2 Admin: Reject an auto-generated task.
  rpc RejectAutoGenTask(RejectAutoGenTaskRequest) returns (RejectAutoGenTaskResponse);
  // Phase 2 Admin: Trigger batch generation (enqueue tasks).
  rpc TriggerBatchGeneration(TriggerBatchGenerationRequest) returns (TriggerBatchGenerationResponse);
  // Phase 3.1: Strategy leaderboard.
  rpc ListLeaderboard(ListLeaderboardRequest) returns (ListLeaderboardResponse);
  // Phase 3.2: Start free trial for a strategy.
  rpc StartTrial(StartTrialRequest) returns (StartTrialResponse);
  // Phase 3.3: Compare strategies side by side.
  rpc CompareStrategies(CompareStrategiesRequest) returns (CompareStrategiesResponse);
  // Phase 3.5: Get public strategy info for share landing page (no auth required).
  rpc GetStrategyPublicInfo(GetStrategyPublicInfoRequest) returns (GetStrategyPublicInfoResponse);
  // Phase 1.3: Provider identity verification.
  rpc RequestVerification(RequestVerificationRequest) returns (RequestVerificationResponse);
  rpc AdminProcessVerification(AdminProcessVerificationRequest) returns (AdminProcessVerificationResponse);
  // Phase 4.1: Admin strategy management.
  rpc AdminListStrategies(AdminListStrategiesRequest) returns (AdminListStrategiesResponse);
  rpc AdminFeatureStrategy(AdminFeatureStrategyRequest) returns (AdminFeatureStrategyResponse);
  // Phase 4.2: Refund request workflow.
  rpc RequestRefund(RequestRefundRequest) returns (RequestRefundResponse);
  rpc AdminListRefundRequests(AdminListRefundRequestsRequest) returns (AdminListRefundRequestsResponse);
  rpc AdminProcessRefund(AdminProcessRefundRequest) returns (AdminProcessRefundResponse);
  // Phase 4.3: Marketplace analytics dashboard.
  rpc GetMarketplaceAnalytics(GetMarketplaceAnalyticsRequest) returns (MarketplaceAnalytics);
  rpc GetTopStrategies(google.protobuf.Empty) returns (TopStrategiesResponse);
  rpc GetTopProviders(google.protobuf.Empty) returns (TopProvidersResponse);
  // Phase 4.5: Coupon / discount codes.
  rpc ValidateCoupon(ValidateCouponRequest) returns (ValidateCouponResponse);
  rpc CreateCoupon(CreateCouponRequest) returns (CreateCouponResponse);
  rpc ListCoupons(ListCouponsRequest) returns (ListCouponsResponse);
  rpc DisableCoupon(DisableCouponRequest) returns (DisableCouponResponse);
  // Phase 4.6: Provider earnings & withdrawal.
  rpc GetProviderEarnings(google.protobuf.Empty) returns (ProviderEarnings);
  rpc ListProviderTransactions(ListProviderTransactionsRequest) returns (ListProviderTransactionsResponse);
  // Phase 5.1: AI strategy iteration — decay detection + optimization.
  rpc DetectStrategyDecay(DetectStrategyDecayRequest) returns (DetectStrategyDecayResponse);
  rpc ListOptimizationTasks(ListOptimizationTasksRequest) returns (ListOptimizationTasksResponse);
  rpc GetOptimizationTask(GetOptimizationTaskRequest) returns (GetOptimizationTaskResponse);
  rpc RejectOptimizationTask(RejectOptimizationTaskRequest) returns (RejectOptimizationTaskResponse);
  rpc PublishOptimization(PublishOptimizationRequest) returns (PublishOptimizationResponse);
  rpc PreviewOptimization(PreviewOptimizationRequest) returns (PreviewOptimizationResponse);
  // Phase 5.2: Strategy bundles.
  rpc CreateBundle(CreateBundleRequest) returns (CreateBundleResponse);
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse);
  rpc GetBundle(GetBundleRequest) returns (GetBundleResponse);
  rpc PurchaseBundle(PurchaseBundleRequest) returns (PurchaseBundleResponse);
  rpc DeleteBundle(DeleteBundleRequest) returns (DeleteBundleResponse);
  // Phase 5.3: Tiered fee rates.
  rpc ListFeeTiers(google.protobuf.Empty) returns (ListFeeTiersResponse);
  rpc UpdateFeeTier(UpdateFeeTierRequest) returns (UpdateFeeTierResponse);
  rpc GetProviderFeeTier(GetProviderFeeTierRequest) returns (GetProviderFeeTierResponse);
}

message PublishStrategyRequest {
  string user_id = 1;
  string strategy_id = 2;
  // Rich metadata (M12-B1: unified with marketplace.Strategy model).
  string title = 3;
  string description = 4;
  string price_model = 5;
  string price_amount = 6;
  string asset_class = 7;
  repeated string symbols = 8;
  string timeframe = 9;
  string risk_level = 10;
  repeated string tags = 11;
  // Code protection: publisher-visible only.
  string code_snippet = 16;  // optional public code preview set by publisher
  BacktestSnapshot backtest_snapshot = 17;  // snapshot of backtest results at publish time
  string disclaimer = 18;  // optional risk disclaimer shown to buyers
  int32 trial_days = 19;  // publisher-configurable trial period (default 7)
}

// BacktestSnapshot holds key backtest metrics at publish time.
// Fields 1-9 are full-period (in-sample) metrics.
// Fields 10-14 are out-of-sample (OOS) metrics from walk-forward validation.
// OOS fields are empty if walk-forward was not performed.
message BacktestSnapshot {
  string total_return = 1;
  string annual_return = 2;
  string max_drawdown = 3;
  string sharpe_ratio = 4;
  string win_rate = 5;
  int32 total_trades = 6;
  string symbol = 7;
  string timeframe = 8;
  google.protobuf.Timestamp snapshot_at = 9;
  // Walk-forward out-of-sample metrics (empty = not performed).
  string oos_sharpe_ratio = 10;
  string oos_total_return = 11;
  string oos_max_drawdown = 12;
  string oos_win_rate = 13;
  int32 oos_total_trades = 14;
}
message PublishStrategyResponse {
  string publish_id = 1;
}

message SubscribeRequest {
  string user_id = 1;
  string publisher_user_id = 2;
  string strategy_id = 3;
  string kind = 4;
}
message SubscribeResponse {
  string subscription_id = 1;
}

message UnsubscribeRequest {
  string user_id = 1;
  string subscription_id = 2;
}
message UnsubscribeResponse {}

message PurchaseStrategyRequest {
  string user_id = 1;
  string strategy_id = 2;        // publish_id
  string publisher_user_id = 3;
  string idempotency_key = 4;    // client-generated unique key to prevent double-charge on retry
  string coupon_code = 5;        // optional discount code
}

message PurchaseStrategyResponse {
  string subscription_id = 1;
  string transaction_id = 2;
  string amount_charged = 3;     // decimal string
  string balance_after = 4;      // decimal string
}

message ListPublishedRequest {
  string user_id = 1;
  int32 limit = 2;
  string asset_class = 3; // optional filter by asset class
  string keyword = 4;    // search title/description/tags (ILIKE)
  string sort_by = 5;    // newest | popular | performance (default: newest)
  int32 offset = 6;      // pagination offset (default: 0)
}
message ListPublishedResponse {
  repeated PublishedStrategy strategies = 1;
}

message PublishedStrategy {
  string publish_id = 1;
  string strategy_id = 2;
  string strategy_name = 3;
  string publisher_user_id = 4;
  google.protobuf.Timestamp published_at = 5;
  // M12-B1: rich marketplace fields from marketplace_strategies table.
  string title = 6;
  string description = 7;
  string price_model = 8;
  string price_amount = 9;
  string asset_class = 10;
  repeated string symbols = 11;
  string timeframe = 12;
  string risk_level = 13;
  repeated string tags = 14;
  int32 total_subscribers = 15;
  double win_rate = 16;
  string total_pnl = 17;
  double avg_rating = 18;
  int32 rating_count = 19;
  // Code protection & performance
  string code_snippet = 22;  // publisher-provided public code preview
  BacktestSnapshot backtest_snapshot = 23;  // snapshot of backtest results
  bool provider_verified = 24;     // provider identity verified badge
  string provider_type = 25;       // human | ai | hybrid
  string disclaimer = 26;          // risk disclaimer shown to buyers
}

message ListSubscriptionsRequest {
  string user_id = 1;
}
message ListSubscriptionsResponse {
  repeated SubscriptionItem subscriptions = 1;
}

message SubscriptionItem {
  string subscription_id = 1;
  string target_user_id = 2;
  string strategy_id = 3;
  string kind = 4;
  bool active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;  // null = permanent (one-time purchase)
}

// --- Rating ---

message RateStrategyRequest {
  string user_id = 1;
  string strategy_id = 2;     // publish_id
  int32 rating = 3;           // 1-5
}

message RateStrategyResponse {
  double avg_rating = 1;
  int32 rating_count = 2;
}

message ListRatingsRequest {
  string strategy_id = 1;     // publish_id
}

message ListRatingsResponse {
  repeated RatingItem ratings = 1;
  double avg_rating = 2;
  int32 rating_count = 3;
}

message RatingItem {
  string id = 1;
  string user_id = 2;
  int32 rating = 3;
  google.protobuf.Timestamp created_at = 4;
}

// --- Comment ---

message CommentOnStrategyRequest {
  string user_id = 1;
  string strategy_id = 2;     // publish_id
  string content = 3;
}

message CommentOnStrategyResponse {
  string id = 1;
}

message ListCommentsRequest {
  string strategy_id = 1;     // publish_id
  int32 limit = 2;
  int32 offset = 3;
}

message ListCommentsResponse {
  repeated CommentItem comments = 1;
  int32 total = 2;
}

message CommentItem {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

// --- Admin Pricing ---

message SetStrategyPricingRequest {
  string strategy_id = 1;       // publish_id
  string price_model = 2;       // "free" | "once" | "subscription"
  string price_amount = 3;
  double platform_fee_rate = 4; // 0.0–1.0, platform commission rate (e.g. 0.10 = 10%)
}

message SetStrategyPricingResponse {
  string strategy_id = 1;
  string price_model = 2;
  string price_amount = 3;
  double platform_fee_rate = 4;
}

// --- Unpublish ---

message UnpublishMarketStrategyRequest {
  string strategy_id = 1;   // publish_id of the strategy to unpublish
}

message UnpublishMarketStrategyResponse {
  string strategy_id = 1;
  string status = 2;        // new status (e.g. "hidden")
}

// --- Publisher Stats ---

message GetPublisherStatsRequest {}

message GetPublisherStatsResponse {
  int32 total_published = 1;
  int32 total_subscribers = 2;
  string total_revenue = 3;
  string monthly_revenue = 4;
  double avg_rating = 5;
  string top_strategy_id = 6;
  string top_strategy_title = 7;
  int32 top_strategy_subs = 8;
  // Phase 2.4: Enhanced analytics
  repeated RevenueTrendPoint revenue_trend = 9;
  repeated SubscriberTrendPoint subscriber_trend = 10;
  repeated StrategyBreakdown strategy_breakdown = 11;
}

message RevenueTrendPoint {
  int64 date_ms = 1;          // day bucket (Unix ms, midnight UTC)
  string sale_revenue = 2;    // one-time purchase revenue (decimal string)
  string subscription_revenue = 3; // subscription revenue (decimal string)
}

message SubscriberTrendPoint {
  int64 date_ms = 1;          // day bucket (Unix ms, midnight UTC)
  int32 new_subscribers = 2;  // new subscriptions/purchases on this day
  int32 churned = 3;          // cancellations/expirations on this day
  int32 active = 4;           // total active at end of day
}

message StrategyBreakdown {
  string strategy_id = 1;
  string title = 2;
  int32 total_subscribers = 3;
  string revenue = 4;         // total revenue (decimal string)
  double avg_rating = 5;
  int32 rating_count = 6;
  string price_model = 7;
  string price_amount = 8;
}

// --- Marketplace Backtest ---

message RunMarketBacktestRequest {
  string strategy_id = 1;   // strategy_template.id
  string symbol = 2;
  string timeframe = 3;
  int64 start_date_ms = 4;  // Unix milliseconds
  int64 end_date_ms = 5;    // Unix milliseconds
  string initial_capital = 6;
  BacktestExecutionConfig execution_config = 7;
}

// --- Live Performance ---

message GetLivePerformanceRequest {
  string strategy_id = 1;
  int32 limit = 2;   // max data points (default 90)
}

message GetLivePerformanceResponse {
  repeated LivePerformancePoint points = 1;
  LivePerformanceSummary summary = 2;
}

message LivePerformancePoint {
  string date = 1;           // YYYY-MM-DD
  string daily_pnl = 2;      // decimal string
  string daily_return = 3;   // decimal string
  string equity = 4;         // decimal string
  string drawdown = 5;       // decimal string
  int32 total_trades = 6;
  int32 winning_trades = 7;
}

message LivePerformanceSummary {
  string total_return = 1;
  string annual_return = 2;
  string max_drawdown = 3;
  string sharpe_ratio = 4;
  string win_rate = 5;
  int32 total_trades = 6;
  string avg_monthly_return = 7;
  string tracking_since = 8;
  string last_updated = 9;
}

message LinkLiveAccountRequest {
  string strategy_id = 1;
  string account_id = 2;
}

message LinkLiveAccountResponse {
  bool success = 1;
}

// ── Phase 2: AI Strategy Generation ──────────────────────────────────────────

message GenerateAndPublishRequest {
  string description = 1;           // natural language strategy description
  string asset_class = 2;           // target asset class
  repeated string symbols = 3;      // target symbols
  string timeframe = 4;             // target timeframe
  string risk_level = 5;            // conservative / moderate / aggressive
  string strategy_type = 6;         // trend_following / mean_reversion / breakout / arbitrage / auto
  bool auto_publish = 7;            // auto-publish after quality gate passes (default true)
  string title_override = 8;        // optional custom strategy title
  string language = 9;              // en / zh-cn
}

message GenerateAndPublishEvent {
  string stage = 1;                 // generating | compiling | backtesting | evaluating | publishing | completed | failed
  string message = 2;               // user-readable status message
  double progress = 3;              // 0.0 ~ 1.0 estimated progress
  // populated at stage=completed
  string strategy_id = 4;           // generated strategy ID
  string publish_id = 5;            // publish ID (if auto_publish=true)
  BacktestSnapshot backtest = 6;    // backtest result summary
  // populated at stage=failed
  string error_stage = 7;           // which step failed
  string error_detail = 8;          // failure reason
  bool retryable = 9;               // user can retry
  // populated at stage=generating (streamed text)
  string delta = 10;                // streaming text delta from LLM
  string python_source = 11;        // final generated source code
  // populated at stage=evaluating
  repeated QualityViolationInfo violations = 12;
}

message QualityViolationInfo {
  string metric = 1;
  string actual = 2;
  string threshold = 3;
}

message GenerateFromTemplateRequest {
  string template_id = 1;
  string parameters_json = 2;       // user-filled parameter values {"fast_period":15,...}
  string symbol = 3;
  string timeframe = 4;
  bool auto_publish = 5;
}

message ListStrategyTemplatesRequest {
  string template_type = 1;         // optional filter
}

message ListStrategyTemplatesResponse {
  repeated StrategyParameterTemplate templates = 1;
}

message StrategyParameterTemplate {
  string id = 1;
  string template_key = 2;
  string template_type = 3;
  string name = 4;                  // localized by Accept-Language
  string description = 5;
  string parameters_schema = 6;     // JSON string for frontend dynamic form rendering
  string default_risk_level = 7;
  string icon = 8;
}

// ── Phase 2 Admin: Batch Generation ──────────────────────────────────────────

message ListAutoGenTasksRequest {
  string status = 1;               // filter by status (empty = all)
  int32 limit = 2;
  int32 offset = 3;
}

message ListAutoGenTasksResponse {
  repeated AutoGenTaskInfo tasks = 1;
  int32 total = 2;
}

message AutoGenTaskInfo {
  string id = 1;
  string symbol = 2;
  string timeframe = 3;
  string strategy_type = 4;
  string risk_level = 5;
  string status = 6;
  string strategy_id = 7;
  bool quality_passed = 8;
  string error_message = 9;
  int64 created_at_ms = 10;
  int64 finished_at_ms = 11;
  BacktestSnapshot backtest = 12;  // snapshot if available
}

message ApproveAutoGenTaskRequest {
  string task_id = 1;
  string price_model = 2;          // optional override
  string price_amount = 3;
}

message ApproveAutoGenTaskResponse {
  bool success = 1;
  string publish_id = 2;
  string error = 3;
}

message RejectAutoGenTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message RejectAutoGenTaskResponse {
  bool success = 1;
}

message TriggerBatchGenerationRequest {
  repeated string symbols = 1;
  repeated string timeframes = 2;
  repeated string strategy_types = 3;
  string risk_level = 4;
}

message TriggerBatchGenerationResponse {
  int32 enqueued = 1;
  string error = 2;
}

// ── Phase 3.1: Strategy Leaderboard ──────────────────────────────────────────

message ListLeaderboardRequest {
  string type = 1;       // return | popular | new
  string period = 2;     // week | month | quarter | all
  int32 limit = 3;       // default 50, max 100
  string asset_class = 4; // optional filter
}

message LeaderboardEntry {
  string strategy_id = 1;
  string publish_id = 2;
  string title = 3;
  string publisher_name = 4;
  string publisher_id = 5;
  string price_model = 6;
  string price_amount = 7;
  string asset_class = 8;
  string timeframe = 9;
  string risk_level = 10;
  int32 total_subscribers = 11;
  double avg_rating = 12;
  int32 rating_count = 13;
  int32 rank = 14;
  // Return leaderboard fields (populated for type=return)
  string total_return = 15;     // decimal string
  string max_drawdown = 16;     // decimal string
  string sharpe_ratio = 17;     // decimal string, empty if N/A
  string win_rate = 18;         // decimal string
  int32 total_trades = 19;
  string tracking_since = 20;   // ISO date, empty if no live tracking
  // New/rising leaderboard fields
  int64 published_at_ms = 21;
  // Backtest summary
  BacktestSnapshot backtest = 22;
}

message ListLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}

// ── Phase 3.2: Free Trial ────────────────────────────────────────────────────

message StartTrialRequest {
  string strategy_id = 1;
}

message StartTrialResponse {
  string trial_id = 1;
  int64 expires_at_ms = 2;
  bool already_tried = 3;  // true if user already had a trial for this strategy
}

// ── Phase 3.3: Strategy Comparison ───────────────────────────────────────────

message CompareStrategiesRequest {
  repeated string strategy_ids = 1;  // max 4
}

message StrategyComparison {
  string strategy_id = 1;
  string title = 2;
  string publisher_name = 3;
  string price_model = 4;
  string price_amount = 5;
  string asset_class = 6;
  string timeframe = 7;
  string risk_level = 8;
  int32 total_subscribers = 9;
  double avg_rating = 10;
  int32 rating_count = 11;
  // Backtest metrics
  string backtest_total_return = 12;
  string backtest_max_drawdown = 13;
  string backtest_sharpe_ratio = 14;
  string backtest_win_rate = 15;
  int32 backtest_total_trades = 16;
  // Live performance (empty if no live tracking)
  string live_total_return = 17;
  string live_max_drawdown = 18;
  string live_sharpe_ratio = 19;
  int32 live_total_trades = 20;
  string tracking_since = 21;
}

message CompareStrategiesResponse {
  repeated StrategyComparison strategies = 1;
}

// ── Phase 3.5: Public Strategy Info (Share Landing Page) ─────────────────────

message GetStrategyPublicInfoRequest {
  string strategy_id = 1;
}

message GetStrategyPublicInfoResponse {
  string strategy_id = 1;
  string title = 2;
  string description = 3;
  string publisher_name = 4;
  string price_model = 5;
  string price_amount = 6;
  string asset_class = 7;
  string timeframe = 8;
  string risk_level = 9;
  int32 total_subscribers = 10;
  double avg_rating = 11;
  int32 rating_count = 12;
  string code_snippet = 13;  // partial code preview (truncated)
  BacktestSnapshot backtest = 14;
  // Live performance summary (empty strings if no live tracking)
  string live_total_return = 15;
  string live_max_drawdown = 16;
  string live_sharpe_ratio = 17;
  string tracking_since = 18;
}

// ── Phase 1.3: Provider Verification ──────────────────────────────────────────

message RequestVerificationRequest {
  string provider_type = 1;  // human | ai | hybrid
  string note = 2;           // optional message to reviewer
}

message RequestVerificationResponse {
  string request_id = 1;
  string status = 2;         // pending
}

message AdminProcessVerificationRequest {
  string request_id = 1;
  bool approve = 2;
  string note = 3;
}

message AdminProcessVerificationResponse {
  bool success = 1;
}

// ── Phase 4.1: Admin Strategy Management ──────────────────────────────────────

message AdminListStrategiesRequest {
  string status = 1;     // published / hidden / all
  string keyword = 2;    // search title
  int32 limit = 3;
  int32 offset = 4;
}

message AdminStrategyItem {
  PublishedStrategy strategy = 1;
  string status = 2;          // published / hidden
  int32 total_sales = 3;
  string total_revenue = 4;
  string platform_revenue = 5;
  string last_sale_at = 6;
  bool is_featured = 7;
  int32 featured_priority = 8;
}

message AdminListStrategiesResponse {
  repeated AdminStrategyItem strategies = 1;
  int32 total = 2;
}

message AdminFeatureStrategyRequest {
  string strategy_id = 1;
  bool featured = 2;
  int32 priority = 3;
}

message AdminFeatureStrategyResponse {
  bool success = 1;
}

// ── Phase 4.2: Refund Request Workflow ────────────────────────────────────────

message RequestRefundRequest {
  string subscription_id = 1;
  string reason = 2;
}

message RequestRefundResponse {
  string refund_id = 1;
  string status = 2;           // pending_review
}

message AdminListRefundRequestsRequest {
  string status = 1;           // pending / approved / rejected
  int32 limit = 2;
  int32 offset = 3;
}

message RefundRequestItem {
  string refund_id = 1;
  string user_id = 2;
  string user_name = 3;
  string subscription_id = 4;
  string strategy_title = 5;
  string amount = 6;
  string reason = 7;
  string status = 8;
  string created_at = 9;
  string reviewed_by = 10;
  string review_note = 11;
}

message AdminListRefundRequestsResponse {
  repeated RefundRequestItem requests = 1;
  int32 total = 2;
}

message AdminProcessRefundRequest {
  string refund_id = 1;
  bool approve = 2;            // true = approve & execute, false = reject
  string review_note = 3;
}

message AdminProcessRefundResponse {
  bool success = 1;
  string error = 2;
}

// ── Phase 4.3: Marketplace Analytics ──────────────────────────────────────────

message GetMarketplaceAnalyticsRequest {
  string period = 1;  // "7d" / "30d" / "90d" / "all"
}

message DailyAnalytics {
  string date = 1;
  string gmv = 2;
  int32 transactions = 3;
  int32 new_subscribers = 4;
}

message MarketplaceAnalytics {
  string total_gmv = 1;
  string platform_revenue = 2;
  string provider_revenue = 3;
  int32 total_transactions = 4;
  int32 active_buyers = 5;
  int32 new_subscribers = 6;
  string arpu = 7;
  int32 total_strategies = 8;
  int32 new_strategies = 9;
  string refund_rate = 10;
  repeated DailyAnalytics daily = 12;
}

message TopItem {
  string id = 1;
  string name = 2;
  string value = 3;
  int32 rank = 4;
}

message TopStrategiesResponse {
  repeated TopItem by_revenue = 1;
  repeated TopItem by_subscribers = 2;
}

message TopProvidersResponse {
  repeated TopItem by_revenue = 1;
  repeated TopItem by_strategies = 2;
}

// ── Phase 4.5: Coupons / Discounts ────────────────────────────────────────────

message ValidateCouponRequest {
  string code = 1;
  string strategy_id = 2;
  string purchase_amount = 3;
}

message ValidateCouponResponse {
  bool valid = 1;
  string discount_type = 2;
  string discount_amount = 3;
  string final_amount = 4;
  string error_message = 5;
}

message CouponInfo {
  string id = 1;
  string code = 2;
  string discount_type = 3;
  string discount_value = 4;
  string min_purchase_amount = 5;
  int32 max_uses = 6;
  int32 used_count = 7;
  string expires_at = 8;
  bool enabled = 9;
  repeated string applicable_strategy_ids = 10;
}

message CreateCouponRequest {
  string code = 1;
  string discount_type = 2;       // percentage / fixed
  string discount_value = 3;
  string min_purchase_amount = 4;
  int32 max_uses = 5;
  string expires_at = 6;          // ISO 8601, empty = never
  repeated string applicable_strategy_ids = 7; // empty = all strategies
}

message CreateCouponResponse {
  string id = 1;
  bool success = 2;
  string error = 3;
}

message ListCouponsRequest {
  bool enabled_only = 1;
}

message ListCouponsResponse {
  repeated CouponInfo coupons = 1;
}

message DisableCouponRequest {
  string coupon_id = 1;
}

message DisableCouponResponse {
  bool success = 1;
}

// ── Phase 4.6: Provider Earnings & Withdrawal ─────────────────────────────────

message ProviderEarnings {
  string total_earnings = 1;
  string available_balance = 2;
  string pending_withdrawal = 3;
  string lifetime_withdrawn = 4;
  int32 total_sales = 5;
  int32 active_strategies = 6;
  string pending_settlement = 7;  // Phase 5.4: frozen settlement balance
}

message ProviderTransactionItem {
  string id = 1;
  string tx_type = 2;       // settlement / fee_settlement / refund_reversal
  string amount = 3;
  string strategy_title = 4;
  string buyer_name = 5;
  string created_at = 6;
}

message ListProviderTransactionsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListProviderTransactionsResponse {
  repeated ProviderTransactionItem transactions = 1;
  int32 total = 2;
}

// ── Phase 5.1: AI Strategy Iteration ──────────────────────────────────────────

message DecayMetrics {
  int32 decay_score = 1;
  string sharpe_decline_pct = 2;
  string winrate_decline_pct = 3;
  string return_delta = 4;
  string trigger_reason = 5;
}

message DetectStrategyDecayRequest {
  string strategy_id = 1;
}

message DetectStrategyDecayResponse {
  bool is_decaying = 1;
  int32 decay_score = 2;       // 0-3, number of signals that fired
  string trigger_reason = 3;
  string baseline_sharpe = 4;
  string baseline_win_rate = 5;
  string recent_sharpe = 6;
  string recent_win_rate = 7;
  string sharpe_decline_pct = 8;
  string winrate_decline_pct = 9;
}

message ListOptimizationTasksRequest {
  string status = 1;    // pending | completed | rejected | published (empty = all)
  int32 limit = 2;
  int32 offset = 3;
}

message OptimizationTaskInfo {
  string id = 1;
  string strategy_id = 2;
  string status = 3;
  string trigger_reason = 4;
  string change_summary = 5;
  int64 created_at_ms = 6;
  int64 completed_at_ms = 7;
  string published_version_id = 8;
}

message ListOptimizationTasksResponse {
  repeated OptimizationTaskInfo tasks = 1;
  int32 total = 2;
}

message GetOptimizationTaskRequest {
  string task_id = 1;
}

message GetOptimizationTaskResponse {
  OptimizationTaskInfo task = 1;
  string suggested_code = 2;
  string suggested_params = 3;
  bytes backtest_snapshot = 4;
  DecayMetrics decay_metrics = 5;
}

message RejectOptimizationTaskRequest {
  string task_id = 1;
}

message RejectOptimizationTaskResponse {
  bool success = 1;
}

message PublishOptimizationRequest {
  string task_id = 1;
}

message PublishOptimizationResponse {
  string version_id = 1;
  bool success = 2;
}

message PreviewOptimizationRequest {
  string task_id = 1;
}

message PreviewOptimizationResponse {
  OptimizationTaskInfo task = 1;
  // Original strategy's backtest snapshot at publish time.
  BacktestSnapshot original_backtest = 2;
  // Optimized version's backtest snapshot from the AI-generated code.
  BacktestSnapshot optimized_backtest = 3;
  // Decay metrics that triggered the optimization.
  DecayMetrics decay_metrics = 4;
  // AI-generated change summary for the optimization.
  string change_summary = 5;
  // Suggested optimized source code (truncated preview).
  string suggested_code_preview = 6;
}

// ── Phase 5.2: Strategy Bundles ───────────────────────────────────────────────

message CreateBundleRequest {
  string title = 1;
  string description = 2;
  string price_model = 3;        // once | subscription
  string price_amount = 4;
  repeated string strategy_ids = 5;
  string platform_fee_rate = 6;  // optional, defaults to 0.10
}

message CreateBundleResponse {
  string bundle_id = 1;
}

message ListBundlesRequest {
  string publisher_id = 1;   // optional filter
  int32 limit = 2;
  int32 offset = 3;
}

message BundleItem {
  string strategy_id = 1;
  int32 sort_order = 2;
  string title = 3;
  string price_amount = 4;
}

message BundleInfo {
  string id = 1;
  string title = 2;
  string description = 3;
  string publisher_id = 4;
  string price_model = 5;
  string price_amount = 6;
  string platform_fee_rate = 7;
  int32 total_purchases = 8;
  int64 created_at_ms = 9;
  repeated BundleItem items = 10;
}

message ListBundlesResponse {
  repeated BundleInfo bundles = 1;
  int32 total = 2;
}

message GetBundleRequest {
  string bundle_id = 1;
}

message GetBundleResponse {
  BundleInfo bundle = 1;
}

message PurchaseBundleRequest {
  string bundle_id = 1;
  string idempotency_key = 2;
}

message PurchaseBundleResponse {
  string subscription_id = 1;
  string transaction_id = 2;
  string amount_charged = 3;
  string balance_after = 4;
}

message DeleteBundleRequest {
  string bundle_id = 1;
}

message DeleteBundleResponse {
  bool success = 1;
}

// ── Phase 5.3: Tiered Fee Rates ───────────────────────────────────────────────

message FeeTierInfo {
  int32 id = 1;
  string tier_name = 2;
  int32 min_sales_count = 3;
  string fee_rate = 4;
  int32 sort_order = 5;
  bool enabled = 6;
}

message ListFeeTiersResponse {
  repeated FeeTierInfo tiers = 1;
}

message UpdateFeeTierRequest {
  int32 id = 1;
  string fee_rate = 2;
  int32 min_sales_count = 3;
  bool enabled = 4;
}

message UpdateFeeTierResponse {
  bool success = 1;
}

message GetProviderFeeTierRequest {
  string publisher_id = 1;
}

message GetProviderFeeTierResponse {
  string tier_name = 1;
  string fee_rate = 2;
  int32 min_sales_count = 3;
  int32 current_sales = 4;
  int32 next_tier_min_sales = 5;
}
