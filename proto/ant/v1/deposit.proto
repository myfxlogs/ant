syntax = "proto3";

package ant.v1;

import "google/protobuf/timestamp.proto";

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

// DepositService manages USDT deposits via HD wallet.
// Users get a personal TRC20 address; deposits are auto-confirmed by chain monitor.
service DepositService {
  // User: get or claim a deposit address (idempotent).
  rpc GetDepositAddress(GetDepositAddressRequest) returns (GetDepositAddressResponse);
  // User: list own deposit history (auto-confirmed by chain monitor).
  rpc ListMyDeposits(ListMyDepositsRequest) returns (ListMyDepositsResponse);
  // Admin: list deposits requiring manual review.
  rpc ListManualReviewDeposits(ListManualReviewDepositsRequest) returns (ListManualReviewDepositsResponse);
  // Admin: list all deposit addresses (assigned + available pool).
  rpc ListDepositAddresses(ListDepositAddressesRequest) returns (ListDepositAddressesResponse);
}

message Deposit {
  string id = 1;
  string user_id = 2;
  string deposit_address_id = 3;
  string tx_hash = 4;
  string amount = 5;               // USDT amount (decimal string)
  int64 block_number = 6;
  int32 confirmations = 7;
  string status = 8;               // CONFIRMED / MANUAL_REVIEW
  google.protobuf.Timestamp confirmed_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetDepositAddressRequest {}
message GetDepositAddressResponse {
  string address = 1;       // TRC20 address (Base58)
  string network = 2;       // "TRC20"
}

message ListMyDepositsRequest {
  int32 page = 1;
  int32 page_size = 2;
}
message ListMyDepositsResponse {
  repeated Deposit deposits = 1;
  int64 total = 2;
}

message ListManualReviewDepositsRequest {
  int32 page = 1;
  int32 page_size = 2;
}
message ListManualReviewDepositsResponse {
  repeated Deposit deposits = 1;
  int64 total = 2;
}

message DepositAddress {
  string id = 1;
  string user_id = 2;          // empty if AVAILABLE
  string address = 3;          // TRC20 Base58
  int32 derivation_index = 4;
  string network = 5;
  string status = 6;           // AVAILABLE / ASSIGNED / RETIRED
  bool has_received_usdt = 7;
  google.protobuf.Timestamp assigned_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListDepositAddressesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;           // filter by status, empty = all
}

message ListDepositAddressesResponse {
  repeated DepositAddress addresses = 1;
  int64 total = 2;
  int32 available_count = 3;   // total AVAILABLE in pool
}
