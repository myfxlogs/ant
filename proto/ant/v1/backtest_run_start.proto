syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "google/protobuf/timestamp.proto";
import "backtest_run.proto";
import "backtest_execution_config.proto";

message StartBacktestRunRequest {
  string code = 1;
  string account_id = 2;
  string symbol = 3;
  string timeframe = 4;
  string initial_capital = 5;
  BacktestRunMode mode = 6;
  optional google.protobuf.Timestamp from = 7;
  optional google.protobuf.Timestamp to = 8;
  optional string dataset_id = 9;
  optional string template_id = 10;
  optional string template_draft_id = 11;
  // Phase B2: secondary symbols (same timeframe/account) whose K-lines are
  // fetched and exposed to the strategy via context['closes_by_symbol'].
  repeated string extra_symbols = 12;
  // Execution config carries commission/slippage/leverage/direction/strict_mode
  // and parsed @strategy directives. Optional; safe defaults when absent.
  BacktestExecutionConfig execution_config = 13;
  // imported_strategies.id — when set, source code + params are fetched
  // from the imported strategy instead of using the code field.
  // If both strategy_id and code are set, strategy_id takes precedence.
  optional string strategy_id = 14;
  // auto_gate: when true, server automatically runs 7-gate pipeline + marketplace
  // quality preview after backtest succeeds, streaming results via WatchBacktestRun.
  bool auto_gate = 15;
}

message StartBacktestRunResponse {
  string run_id = 1;
}
