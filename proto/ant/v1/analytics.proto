syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

service AnalyticsService {
  rpc GetAccountAnalytics(GetAccountAnalyticsRequest) returns (AccountAnalyticsResponse);
  rpc GetRecentTrades(GetRecentTradesRequest) returns (GetRecentTradesResponse);
  rpc GetMonthlyPnL(GetMonthlyPnLRequest) returns (GetMonthlyPnLResponse);
  rpc GetMonthlyAnalysis(GetMonthlyAnalysisRequest) returns (GetMonthlyAnalysisResponse);
  rpc GetMonthlyDetail(GetMonthlyDetailRequest) returns (GetMonthlyDetailResponse);
  rpc GetAttributionAnalysis(GetAttributionAnalysisRequest) returns (GetAttributionAnalysisResponse);
  rpc GetRollingMetrics(GetRollingMetricsRequest) returns (GetRollingMetricsResponse);
  rpc GenerateReport(GenerateReportRequest) returns (stream GenerateReportChunk);
}

enum EquityCurvePeriod {
  EQUITY_CURVE_PERIOD_UNSPECIFIED = 0;
  EQUITY_CURVE_PERIOD_DAY = 1;
  EQUITY_CURVE_PERIOD_WEEK = 2;
  EQUITY_CURVE_PERIOD_MONTH = 3;
  EQUITY_CURVE_PERIOD_ALL = 4;
}

message GetAccountAnalyticsRequest {
  string account_id = 1;
  EquityCurvePeriod equity_curve_period = 2;
}

message AccountAnalyticsResponse {
  TradeStats trade_stats = 1;
  RiskMetrics risk_metrics = 2;
  repeated SymbolStat symbol_stats = 3;
  repeated EquityPoint equity_curve = 4;
  repeated DailyPnL daily_pnl = 5;
  repeated HourlyStat hourly_stats = 6;
}

message TradeStats {
  int64 total_trades = 1;
  double win_rate = 2;              // percentage (ratio)
  double profit_factor = 3;         // ratio
  string average_profit = 4;        // monetary
  string average_loss = 5;          // monetary
  string largest_win = 6;           // monetary
  string largest_loss = 7;          // monetary
  int64 max_consecutive_wins = 8;
  int64 max_consecutive_losses = 9;
  string average_holding_time = 10;
  string net_profit = 11;           // monetary
  string total_deposit = 12;        // monetary
  string total_withdrawal = 13;     // monetary
  string net_deposit = 14;          // monetary
}

message RiskMetrics {
  double max_drawdown_percent = 1;  // percentage (ratio)
  double sharpe_ratio = 2;          // ratio
  double sortino_ratio = 3;         // ratio
  double calmar_ratio = 4;          // ratio
  double volatility = 5;            // ratio (std dev)
  double average_daily_return = 6;  // ratio
}

message SymbolStat {
  string symbol = 1;
  string profit = 2;                // monetary
  double trade_share_percent = 3;   // percentage (ratio)
}

message EquityPoint {
  string date = 1;
  string equity = 2;                // monetary
  string balance = 3;               // monetary
  string profit = 4;                // monetary
}

message DailyPnL {
  string day = 1;
  string date = 2;
  string pnl = 3;                   // monetary
  int64 trades = 4;
  string lots = 5;                  // monetary (volume)
  string balance = 6;               // monetary
  double profit_factor = 7;         // ratio
  string max_floating_loss_amount = 8;   // monetary
  double max_floating_loss_ratio = 9;    // percentage (ratio)
  string max_floating_profit_amount = 10; // monetary
  double max_floating_profit_ratio = 11;  // percentage (ratio)
}

message HourlyStat {
  int32 hour = 1;
  string lots = 2;                  // monetary (volume)
  string balance = 3;               // monetary
  double profit_factor = 4;         // ratio
  string max_floating_loss_amount = 5;   // monetary
  double max_floating_loss_ratio = 6;    // percentage (ratio)
  string max_floating_profit_amount = 7; // monetary
  double max_floating_profit_ratio = 8;  // percentage (ratio)
}

message TradeRecord {
  string ticket = 1;
  string symbol = 2;
  string type = 3;
  string volume = 4;                // monetary (volume)
  string open_price = 5;            // monetary (price)
  string close_price = 6;           // monetary (price)
  string profit = 7;                // monetary
  string open_time = 8;
  string close_time = 9;
  string swap = 10;                 // monetary
  string commission = 11;           // monetary
  string comment = 12;
}

message GetRecentTradesRequest {
  string account_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetRecentTradesResponse {
  repeated TradeRecord trades = 1;
  int64 total = 2;
}

message MonthlyPnLItem {
  int32 month = 1;
  string profit = 2;                // monetary
  int64 trades = 3;
}

message GetMonthlyPnLRequest {
  string account_id = 1;
  int32 year = 2;
}

message GetMonthlyPnLResponse {
  repeated MonthlyPnLItem monthly_pnl = 1;
}

message GetMonthlyAnalysisRequest {
  string account_id = 1;
}

message GetMonthlyAnalysisResponse {
  repeated int32 years = 1;
  bytes data = 2;
}

// ── Monthly Detail (drill-down) ──

message GetMonthlyDetailRequest {
  string account_id = 1;
  int32 year = 2;
  int32 month = 3;  // 1-12
}

message GetMonthlyDetailResponse {
  MonthlyDetailMetrics metrics = 1;
  repeated SymbolMonthlyPnL symbol_pnls = 2;
  HoldingTimeStats holding_stats = 3;
  MonthlyBonus bonus = 4;
}

message MonthlyDetailMetrics {
  string net_return = 1;            // monetary
  double return_percent = 2;        // percentage (ratio)
  int64 total_trades = 3;
  double win_rate = 4;              // percentage (ratio)
  double profit_factor = 5;         // ratio
  string best_trade = 6;            // monetary
  string worst_trade = 7;           // monetary
}

message SymbolMonthlyPnL {
  string symbol = 1;
  string net_profit = 2;            // monetary
  int64 trades = 3;
  double win_rate = 4;              // percentage (ratio)
}

message HoldingTimeStats {
  double average_hours = 1;         // time (hours)
  double median_hours = 2;          // time (hours)
  double max_hours = 3;             // time (hours)
  double min_hours = 4;             // time (hours)
}

// ── Monthly Bonus (myfxbook-style panels) ──

message MonthlyBonus {
  double risk_ratio = 1;            // ratio
  repeated SymbolPopularityItem symbol_popularity = 2;
  repeated SymbolRiskItem symbol_risks = 3;
  repeated SymbolHoldingSplit symbol_holding_split = 4;
}

message SymbolPopularityItem {
  string symbol = 1;
  int64 trades = 2;
  double share_percent = 3;         // percentage (ratio)
}

message SymbolRiskItem {
  string symbol = 1;
  double risk_ratio = 2;            // ratio
}

message SymbolHoldingSplit {
  string symbol = 1;
  double bulls_seconds = 2;         // time (seconds)
  double short_term_seconds = 3;    // time (seconds)
}

// ── Attribution Analysis ──

message GetAttributionAnalysisRequest {
  string account_id = 1;
}

message GetAttributionAnalysisResponse {
  repeated SymbolPnL symbol_pnls = 1;
  DirectionBreakdown direction = 2;
  TradeDistribution trade_distribution = 3;
  repeated HourlyPnL hourly_pnl = 4;
}

message SymbolPnL {
  string symbol = 1;
  string net_profit = 2;            // monetary
  int64 total_trades = 3;
  double win_rate = 4;              // percentage (ratio)
  double profit_factor = 5;         // ratio
  double trade_share_percent = 6;   // percentage (ratio)
}

message DirectionBreakdown {
  string long_profit = 1;           // monetary
  int64 long_trades = 2;
  double long_win_rate = 3;         // percentage (ratio)
  string short_profit = 4;          // monetary
  int64 short_trades = 5;
  double short_win_rate = 6;        // percentage (ratio)
}

message TradeDistribution {
  repeated TradeBucket profit_buckets = 1;
  repeated TradeBucket holding_buckets = 2;
}

message TradeBucket {
  string label = 1;
  string min_value = 2;             // monetary
  string max_value = 3;             // monetary
  int64 count = 4;
}

message HourlyPnL {
  int32 hour = 1;
  string profit = 2;                // monetary
  int64 trades = 3;
  double win_rate = 4;              // percentage (ratio)
}

// ── Rolling Metrics ──

message GetRollingMetricsRequest {
  string account_id = 1;
}

message GetRollingMetricsResponse {
  repeated RollingPoint rolling_sharpe = 1;
  repeated DrawdownEvent drawdown_events = 2;
  repeated MonthlyWinRate monthly_win_rates = 3;
  repeated EquityPoint equity_curve = 4;
  repeated DrawdownPoint drawdown_curve = 5;
}

message RollingPoint {
  string date = 1;
  double value = 2;                 // ratio (Sharpe value)
}

message DrawdownEvent {
  string start_date = 1;
  string end_date = 2;
  int32 duration_days = 3;
  double depth_percent = 4;         // percentage (ratio)
  string recovery_date = 5;
}

message DrawdownPoint {
  string date = 1;
  double drawdown_percent = 2;      // percentage (ratio)
}

message MonthlyWinRate {
  string month = 1;
  double win_rate = 2;              // percentage (ratio)
  int64 total_trades = 3;
}

// ── Report Generation (SSE streaming) ──

message GenerateReportRequest {
  string account_id = 1;
  string period = 2; // week, month, quarter, year
  string locale = 3;  // e.g. zh-CN, en, ja, vi
}

message GenerateReportChunk {
  string phase = 1;    // computing, analyzing, done
  string delta = 2;    // streaming text
  string section = 3;  // summary, findings, recommendations
  string error = 4;
  bool done = 5;
  string summary = 6;
  string findings = 7;
  string recommendations = 8;
}
