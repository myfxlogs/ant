syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "common.proto";
import "backtest_run.proto";
import "backtest_execution_config.proto";
import "ai_gate.proto";

message GetBacktestRunRequest {
  string run_id = 1;
}

message GetBacktestRunResponse {
  BacktestRun run = 1;
  BacktestMetrics metrics = 2;
  repeated string equity_curve = 3;
  optional string dataset_id = 4;
  BacktestRisk risk = 5;
  ExecutionAssumptions execution_assumptions = 6;
}

message WatchBacktestRunRequest {
  string run_id = 1;
}

message BacktestRunUpdate {
  BacktestRun run = 1;
  BacktestMetrics metrics = 2;
  repeated string equity_curve = 3;
  BacktestRisk risk = 4;
  ExecutionAssumptions execution_assumptions = 5;
  // 7-gate evaluation result (sent when auto_gate=true and run succeeds).
  GateEvaluationUpdate gate_update = 6;
  // Marketplace quality gate preview (sent when auto_gate=true and run succeeds).
  MarketplaceQualityPreview quality_preview = 7;
  // Invariant blind spots that make results unreliable (sent when status=DEGRADED).
  repeated BacktestBlindSpot blind_spots = 8;
}

message BacktestBlindSpot {
  string id = 1;
  string description = 2;
  string severity = 3;
}

message MarketplaceQualityPreview {
  bool publishable = 1;
  repeated QualityViolation violations = 2;
}

message QualityViolation {
  string metric = 1;
  string actual = 2;
  string threshold = 3;
}

message ListBacktestRunsRequest {
  optional string account_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  optional string template_id = 4;
}

message ListBacktestRunsResponse {
  repeated BacktestRun runs = 1;
}
