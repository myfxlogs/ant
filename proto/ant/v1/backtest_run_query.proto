syntax = "proto3";

package ant.v1;

option go_package = "anttrader/gen/proto/ant/v1;antv1";

import "common.proto";
import "backtest_run.proto";
import "backtest_execution_config.proto";

message GetBacktestRunRequest {
  string run_id = 1;
}

message GetBacktestRunResponse {
  BacktestRun run = 1;
  BacktestMetrics metrics = 2;
  repeated double equity_curve = 3;
  optional string dataset_id = 4;
  BacktestRisk risk = 5;
  ExecutionAssumptions execution_assumptions = 6;
}

message WatchBacktestRunRequest {
  string run_id = 1;
}

message BacktestRunUpdate {
  BacktestRun run = 1;
  BacktestMetrics metrics = 2;
  repeated double equity_curve = 3;
  BacktestRisk risk = 4;
  ExecutionAssumptions execution_assumptions = 5;
}

message ListBacktestRunsRequest {
  optional string account_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListBacktestRunsResponse {
  repeated BacktestRun runs = 1;
}
