syntax = "proto3";

package ant.v1;

option go_package = "anttrader/gen/proto/ant/v1;antv1";

import "python_strategy.proto";

service CodeAssistService {
  rpc ReviseCode(ReviseCodeRequest) returns (ReviseCodeResponse);
  rpc ReviseCodeStream(ReviseCodeRequest) returns (stream ReviseCodeStreamChunk);
  rpc ExplainCode(ExplainCodeRequest) returns (ExplainCodeResponse);
  rpc ValidateStrategyExtended(ValidateStrategyExtendedRequest) returns (ValidateStrategyExtendedResponse);
  // TransformCode translates EA/indicator code (MQL4/MQL5) to Python strategy code.
  rpc TransformCode(TransformCodeRequest) returns (TransformCodeResponse);
  // TranslateParamLabels translates strategy parameter labels to all supported locales.
  rpc TranslateParamLabels(TranslateParamLabelsRequest) returns (TranslateParamLabelsResponse);
}

message TranslateParamLabelsRequest {
  // Parameter names to translate (the raw names from self.ctx.param() calls).
  repeated string param_names = 1;
}

message TranslateParamLabelsResponse {
  // translations[locale][param_name] = translated_label
  // Top-level keys are locale codes: "en", "zh-cn", "zh-tw", "ja", "vi"
  map<string, ParamLabelMap> translations = 1;
}

message ParamLabelMap {
  map<string, string> labels = 1;
}

message CodeChatMessage {
  string role = 1;
  string content = 2;
}

message ReviseCodeRequest {
  string code = 1;
  string instruction = 2;
  repeated CodeChatMessage history = 3;
  string locale = 4;
  string session_id = 5;
}

message ReviseCodeResponse {
  string text = 1;
  string python = 2;
}

message ReviseCodeStreamChunk {
  string delta = 1;   // incremental text delta
  string python = 2;  // extracted python code (only on final chunk)
  bool done = 3;      // true on final chunk
}

message ExplainCodeRequest {
  string code = 1;
  string locale = 2;
}

message ExplainCodeResponse {
  string explanation = 1;
}

message ValidateStrategyExtendedRequest {
  string code = 1;
}

message ValidateStrategyExtendedResponse {
  bool valid = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
  repeated RequiredParamSpec parameters = 4;
  // Code quality hints from Python static analysis (zero-trust).
  repeated CodeQualityHint quality_hints = 5;
  // Sweep dimensions from @param annotations (zero-trust).
  repeated SweepDimension sweep_dimensions = 6;
  // Strategy directives from @strategy annotations (zero-trust).
  repeated StrategyDirective strategy_directives = 7;
  // Extracted self.ctx.param() calls as JSON array of {name, type, default, label}.
  string parameters_json = 8;
}

message RequiredParamSpec {
  string key = 1;
  bool required = 2;
  string default_value = 3;
  string type = 4;
  string suggested_value = 5;
}

message TransformCodeRequest {
  string source_code = 1;   // MQL4/MQL5 EA or indicator code
  string source_lang = 2;   // "mql4", "mql5", or "auto" (auto-detect)
  string target_lang = 3;   // "python" (target language)
}

message TransformCodeResponse {
  string target_code = 1;    // translated Python strategy code
  string explanation = 2;    // summary of what was translated and key mappings
  string detected_lang = 3;  // detected source language if source_lang was "auto"
}
