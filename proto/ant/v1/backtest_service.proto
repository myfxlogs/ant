syntax = "proto3";

package ant.v1;

option go_package = "anttrader/gen/proto/ant/v1;antv1";

import "backtest_execution_config.proto";

// BacktestService runs strategy backtests via the Go backtest engine.
// Python strategy engine has been retired (see ADR-0021).
service BacktestService {
  rpc RunBacktest(ExecuteBacktestRequest) returns (ExecuteBacktestResponse);
  rpc ValidateStrategy(EngineValidateRequest) returns (EngineValidateResponse);
  rpc RunStrategy(EngineRunStrategyRequest) returns (EngineRunStrategyResponse);
}

message EngineValidateRequest { string strategy_code = 1; }
message EngineValidateResponse {
  bool valid = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
  string parameters_json = 4;  // JSON array of {name, type, default, label}
}

message EngineRunStrategyRequest {
  string strategy_id = 1; string strategy_code = 2;
  string symbol = 3; string timeframe = 4;
  repeated ExecuteKlineBar klines = 5;
}
message EngineRunStrategyResponse {
  bool success = 1; EngineTradeSignal signal = 2; string error = 3;
}
message EngineTradeSignal {
  string signal = 1; string symbol = 2; string price = 3;
  string volume = 4; string stop_loss = 5; string take_profit = 6;
  double confidence = 7; string reason = 8;
}

message ExecuteKlineBar {
  int64 open_time_ms = 1;   // Unix milliseconds
  int64 close_time_ms = 2;  // Unix milliseconds
  string open = 3;
  string high = 4;
  string low = 5;
  string close = 6;
  string volume = 7;
}

message ExecuteBacktestRequest {
  string strategy_id = 1;   // unique run identifier
  string strategy_code = 2; // strategy source code (Go SDK)
  string symbol = 3;
  string timeframe = 4;
  int64 start_date_ms = 5;  // Unix milliseconds
  int64 end_date_ms = 6;    // Unix milliseconds
  string initial_capital = 7;
  string commission = 8;
  string spread = 9;
  string swap_rate = 10;
  string server_timezone = 11;
  int32 rollover_hour = 12;
  int32 triple_swap_weekday = 13;
  string slippage_mode = 14;
  string slippage_rate = 15;
  int32 slippage_seed = 16;
  repeated ExecuteKlineBar klines = 17;
  repeated string extra_symbols = 18;
  map<string, string> strategy_params = 19;
  string leverage = 20;                  // e.g. "1", "10", "100" (ratio as string for precision)
  TradeDirection trade_direction = 21; // long / short / both
  bool strict_mode = 22;              // true = next-bar-open, false = same-bar-close + MTF
  StrategyConfig strategy_config = 23; // parsed from @strategy annotations
  SymbolInfo symbol_info = 24;         // broker-provided contract metadata
}

// SymbolInfo carries contract metadata queried from the MT4/MT5 broker.
// This is the authoritative source — no hardcoded guesses.
message SymbolInfo {
  int32 digits = 1;            // decimal places in price quotes
  string point = 2;            // minimum price increment (10^-digits)
  string tick_size = 3;        // minimum tick size
  string tick_value = 4;       // value of one tick in account currency
  string contract_size = 5;    // base units per lot
  string volume_min = 6;       // minimum order volume (lots)
  string volume_max = 7;       // maximum order volume (lots)
  string volume_step = 8;      // lot increment step
  int32 stops_level = 9;       // SL/TP minimum distance in points
  int32 freeze_level = 10;     // order freeze distance in points
  string swap_long = 11;       // long swap rate
  string swap_short = 12;      // short swap rate
  string margin_rate = 13;     // initial margin rate
}

message ExecuteBacktestTrade {
  int64 ticket = 1;
  string side = 2;
  string volume = 3;
  int64 open_ts_ms = 4;
  string open_price = 5;
  int64 close_ts_ms = 6;
  string close_price = 7;
  string pnl = 8;
  string commission = 9;
  string reason = 10;
}

message ExecuteBacktestResponse {
  bool success = 1;
  ExecuteBacktestMetrics metrics = 2;
  ExecuteRiskAssessment risk = 3;
  repeated string equity_curve = 4;     // decimal strings for precision
  repeated ExecuteBacktestTrade trades = 5;
  string error = 6;
  ExecutionAssumptions execution_assumptions = 7;
}

message ExecuteBacktestMetrics {
  double total_return = 1;
  double annual_return = 2;
  double max_drawdown = 3;
  double sharpe_ratio = 4;
  double win_rate = 5;
  double profit_factor = 6;
  int32 total_trades = 7;
  int32 winning_trades = 8;
  int32 losing_trades = 9;
  string average_profit = 10;
  string average_loss = 11;
  string total_pnl_absolute = 12;  // absolute PnL (initial_capital * total_return)
}

message ExecuteRiskAssessment {
  int32 score = 1;
  string level = 2;
  repeated string reasons = 3;
  repeated string warnings = 4;
  bool is_reliable = 5;
}

