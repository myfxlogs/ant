syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";
import "strategy_messages.proto";
import "backtest_run_start.proto";
import "backtest_run_query.proto";
import "backtest_run_control.proto";
import "parameter_entry.proto";

service StrategyRuntimeService {
  rpc Execute(ExecuteStrategyRequest) returns (ExecuteStrategyResponse);
  rpc Validate(ValidateStrategyRequest) returns (ValidateStrategyResponse);
  rpc Backtest(BacktestStrategyRequest) returns (BacktestStrategyResponse);
  rpc StartBacktestRun(StartBacktestRunRequest) returns (StartBacktestRunResponse);
  rpc GetBacktestRun(GetBacktestRunRequest) returns (GetBacktestRunResponse);
  rpc ListBacktestRuns(ListBacktestRunsRequest) returns (ListBacktestRunsResponse);
  rpc WatchBacktestRun(WatchBacktestRunRequest) returns (stream BacktestRunUpdate);
  rpc CancelBacktestRun(CancelBacktestRunRequest) returns (CancelBacktestRunResponse);
  rpc DeleteBacktestRun(DeleteBacktestRunRequest) returns (DeleteBacktestRunResponse);
  rpc DeleteBacktestRuns(DeleteBacktestRunsRequest) returns (DeleteBacktestRunsResponse);
  rpc GetTemplates(google.protobuf.Empty) returns (GetStrategyTemplatesResponse);
  // ExecuteLive: proto-native live/paper strategy execution.
  // Go LiveStrategyRunner sends proto-native LiveStrategyContext (no JSON).
  rpc ExecuteLive(ExecuteLiveRequest) returns (ExecuteLiveResponse);
  // AnalyzeCode analyzes MQL source and returns strategy intent summary + param panel + blind spots.
  rpc AnalyzeImportCode(AnalyzeImportCodeRequest) returns (AnalyzeImportCodeResponse);
  // ImportStrategy runs the full import pipeline: analyze → persist → return strategy ID.
  rpc ImportStrategy(ImportStrategyRequest) returns (ImportStrategyResponse);
  // GetImportedStrategy retrieves a previously imported strategy by ID.
  rpc GetImportedStrategy(GetImportedStrategyRequest) returns (GetImportedStrategyResponse);
  // ListStrategyRuns returns recent live/paper strategy run records.
  rpc ListStrategyRuns(ListStrategyRunsRequest) returns (ListStrategyRunsResponse);
  // GetStrategyRun returns a single strategy run by ID.
  rpc GetStrategyRun(GetStrategyRunRequest) returns (GetStrategyRunResponse);
  // ListActiveStrategies returns currently running strategy sessions.
  rpc ListActiveStrategies(ListActiveStrategiesRequest) returns (ListActiveStrategiesResponse);
  // GetActiveStrategy returns a single active strategy session by run ID.
  rpc GetActiveStrategy(GetActiveStrategyRequest) returns (GetActiveStrategyResponse);
  // StopStrategy cancels a running strategy session by run ID.
  rpc StopStrategy(StopStrategyRequest) returns (StopStrategyResponse);
  // WatchStrategySignals streams real-time signals from a running strategy.
  rpc WatchStrategySignals(WatchStrategySignalsRequest) returns (stream StrategySignalEvent);
  // StartStrategy launches a new live or paper strategy run.
  rpc StartStrategy(StartStrategyRequest) returns (StartStrategyResponse);
  // WatchActiveStrategies streams the active strategy list, pushing updates
  // whenever sessions are registered, deregistered, or change state.
  rpc WatchActiveStrategies(WatchActiveStrategiesRequest) returns (stream WatchActiveStrategiesEvent);
  // ListStrategyVersions returns version history for a strategy.
  rpc ListStrategyVersions(ListStrategyVersionsRequest) returns (ListStrategyVersionsResponse);
  // GetStrategyVersion retrieves a specific version snapshot.
  rpc GetStrategyVersion(GetStrategyVersionRequest) returns (GetStrategyVersionResponse);
  // RollbackStrategyVersion restores strategy code from a specific version.
  rpc RollbackStrategyVersion(RollbackStrategyVersionRequest) returns (RollbackStrategyVersionResponse);
  // DiffStrategyVersions returns two version snapshots for client-side diffing.
  rpc DiffStrategyVersions(DiffStrategyVersionsRequest) returns (DiffStrategyVersionsResponse);
  // UpdateStrategyCode updates the source code of an existing strategy and creates a version snapshot.
  rpc UpdateStrategyCode(UpdateStrategyCodeRequest) returns (UpdateStrategyCodeResponse);
}

message GetImportedStrategyRequest {
  string strategy_id = 1;
}

message GetImportedStrategyResponse {
  string strategy_id = 1;
  string strategy_name = 2;
  string source_lang = 3;
  string source_code = 4;
  double coverage_score = 5;
  bytes params = 6;           // proto-serialized ParamDecl list
}

message ExecuteStrategyRequest {
  string code = 1;
  string account_id = 2;
  string symbol = 3;
  string timeframe = 4;
}

message ExecuteStrategyResponse {
  bool success = 1;
  StrategySignal signal = 2;
  repeated string logs = 3;
  string error = 4;
}

message ValidateStrategyRequest {
  string code = 1;
}

message ValidateStrategyResponse {
  bool valid = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
  repeated CodeQualityHint quality_hints = 4;
  repeated SweepDimension sweep_dimensions = 5;
  repeated StrategyDirective strategy_directives = 6;
  // Auto-detected strategy type from code analysis.
  // "run_context" = event-driven OnInit/OnBar | "run_dataframe" = vectorized
  string strategy_type = 7;
  // Extracted ctx.Param() calls as structured parameter entries.
  // Frontend uses this to render parameter input fields in the backtest card.
  repeated ParameterEntry parameters = 8;
}

// CodeQualityHint reports a single code quality issue found by static analysis.
message CodeQualityHint {
  // Category enum: "FUTURE_DATA_LEAK" | "MISSING_PARAM" | "UNREAD_PARAM"
  string category = 1;
  // Severity: "error" | "warn" | "info"
  string severity = 2;
  // Human-readable message (Chinese preferred)
  string message = 3;
  // Approximate 1-based line number
  int32 line = 4;
  // Problematic code fragment
  string snippet = 5;
}

// SweepDimension describes a single parameter dimension for Smart Tuning.
// Extracted from @param annotations by the strategy backend (zero-trust).
message SweepDimension {
  string key = 1;
  // "int" | "float"
  string type = 2;
  double default = 3;
  double min = 4;
  double max = 5;
  double step = 6;
  bool has_range = 7;
}

// StrategyDirective is a key-value directive from @strategy annotations.
// Extracted by the strategy backend (zero-trust).
message StrategyDirective {
  string key = 1;
  string value = 2;
}

message BacktestStrategyRequest {
  string code = 1;
  string account_id = 2;
  string symbol = 3;
  string timeframe = 4;
  string initial_capital = 5;
  optional string dataset_id = 6;
}

message BacktestStrategyResponse {
  bool success = 1;
  BacktestMetrics metrics = 2;
  repeated string equity_curve = 3;
  string error = 4;
  optional string dataset_id = 5;
}

message GetStrategyTemplatesResponse {
  repeated StrategyTemplateInfo templates = 1;
}

message StrategyTemplateInfo {
  string name = 1;
  string description = 2;
  string code = 3;
}

// ── ExecuteLive: proto-native live/paper strategy execution ──

// RequestType selects which execution callback the harness dispatches to.
enum RequestType {
  REQUEST_TYPE_UNSPECIFIED = 0;
  REQUEST_TYPE_BAR = 1;    // OnBar — new bar closed
  REQUEST_TYPE_TICK = 2;   // OnTick — price update (Bid/Ask)
  REQUEST_TYPE_TRADE = 3;  // OnTrade — order fill/close/modify
  REQUEST_TYPE_TIMER = 4;  // OnTimer — periodic timer fired
}

// ExecuteLiveRequest sends strategy code with a proto-native context message.
// The Go-side LiveStrategyRunner builds the context from real-time data
// and calls this RPC per event (bar, tick, trade, or timer).
message ExecuteLiveRequest {
  string strategy_code = 1;
  RequestType request_type = 2;
  // Context data — which field is populated depends on request_type.
  LiveStrategyContext bar_context = 3;    // REQUEST_TYPE_BAR
  TickContext tick_context = 4;           // REQUEST_TYPE_TICK
  TradeContext trade_context = 5;         // REQUEST_TYPE_TRADE
  TimerContext timer_context = 6;         // REQUEST_TYPE_TIMER
  string strategy_id = 7;                // imported strategy ID for bytecode cache
}

message ExecuteLiveResponse {
  bool success = 1;
  StrategySignal signal = 2;            // deprecated — first signal only
  string error = 3;
  string strategy_hash = 4;             // cached worker identifier for debugging
  repeated StrategySignal signals = 5;  // all signals (multi-intent per bar)
}

// LiveStrategyContext is the execution context passed to OnInit/OnBar in live/paper mode.
// Proto-native binary encoding — no JSON marshalling.
message LiveStrategyContext {
  // Market data (primary symbol OHLCV — length-aligned arrays)
  repeated string close = 1;
  repeated string open = 2;
  repeated string high = 3;
  repeated string low = 4;
  repeated string volume = 5;
  repeated int64 bar_times_ms = 6;  // bar close timestamps in unix ms

  // Account state
  string equity = 7;
  string balance = 8;
  LivePosition position = 9;        // current open position (nil = none)
  repeated LivePosition positions = 10;  // all open positions

  // Metadata
  string symbol = 11;
  string timeframe = 12;
  string mode = 13;  // "live" | "paper"
  repeated LiveParam params = 14;

  // Multi-symbol views (Phase B2 — optional)
  repeated LiveSymbolSeries symbols = 15;
  string primary_symbol = 16;
  string current_price = 17;

  // Delta-bar protocol: if non-empty, the harness appends these to its local
  // bar window instead of rebuilding from close/open/high/low/volume arrays.
  // The first bar of a session uses the full OHLCV arrays; subsequent bars
  // use this field for incremental delivery.
  repeated DeltaBar delta_bars = 18;
}

// LivePosition mirrors the engine Position for live context.
message LivePosition {
  int64 ticket = 1;
  string side = 2;       // "buy" | "sell"
  string volume = 3;
  string open_price = 4;
  string sl = 5;
  string tp = 6;
  string swap = 7;
  string commission = 8;
}

// LiveParam is a key-value strategy parameter.
message LiveParam {
  string key = 1;
  string value = 2;  // stringly-typed; strategy calls params.get(key) → converts as needed
}

// LiveSymbolSeries holds OHLCV for one symbol in multi-symbol mode.
message LiveSymbolSeries {
  string symbol = 1;
  repeated string close = 2;
  repeated string open = 3;
  repeated string high = 4;
  repeated string low = 5;
  repeated string volume = 6;
}

// DeltaBar is a single OHLCV bar for the delta-bar protocol.
// When LiveStrategyContext.delta_bars is non-empty, the harness appends
// these bars to its local rolling window rather than rebuilding from the
// full OHLCV arrays.
message DeltaBar {
  string open = 1;
  string high = 2;
  string low = 3;
  string close = 4;
  string volume = 5;
  int64 bar_time_ms = 6;
}

// TickContext carries a single quote update for OnTick strategies.
message TickContext {
  string bid = 1;
  string ask = 2;
  string symbol = 3;
  string timeframe = 4;
  string mode = 5;   // "live" | "paper"
  repeated LiveParam params = 6;
  // Account state
  string equity = 7;
  string balance = 8;
  repeated LivePosition positions = 9;
  string current_price = 10;
}

// TradeContext carries a trade event for OnTrade strategies.
message TradeContext {
  int64 ticket = 1;
  string symbol = 2;
  string event_type = 3;  // "fill" | "close" | "modify" | "cancel"
  string side = 4;        // "buy" | "sell"
  string volume = 5;
  string price = 6;
  string stop_loss = 7;
  string take_profit = 8;
  string profit = 9;
  string commission = 10;
  string swap = 11;
  // Account state
  string equity = 12;
  string balance = 13;
  repeated LivePosition positions = 14;
}

// TimerContext carries a periodic timer fire for OnTimer strategies.
message TimerContext {
  string symbol = 1;
  string timeframe = 2;
  string mode = 3;   // "live" | "paper"
  repeated LiveParam params = 4;
  // Account state
  string equity = 5;
  string balance = 6;
  repeated LivePosition positions = 7;
}

// ── Strategy Import (migration engine) ──────────────────────────────

message AnalyzeImportCodeRequest {
  string source_code = 1;
  string source_name = 2;
  string source_lang = 3;
}

message AnalyzeImportCodeResponse {
  string strategy_name = 1;
  string mql_version = 2;
  double coverage_score = 10;
  int32 total_blocks = 11;
  int32 recognized_blocks = 12;
  string execution_kind = 30;
  int32 entry_rules_count = 50;
  int32 exit_rules_count = 51;
  string sizing_kind = 52;
  int32 risk_checks_count = 53;
  repeated ParamField params = 60;
  repeated ParamGroupInfo groups = 61;
  repeated BlindSpot blind_spots = 70;
  repeated string indicator_names = 80;
}

message ParamField {
  string name = 1;
  string label = 2;
  string type = 3;       // "int" | "double" | "string" | "bool" | "enum"
  string default_value = 4;
  string group = 5;      // group name this param belongs to
}

message ParamGroupInfo {
  string name = 1;
}

message BlindSpot {
  string id = 1;
  string category = 2;
  string severity = 3;    // "致命" | "警告" | "信息"
  string description = 4;
  string location = 5;
  string handling = 6;
  bool user_action_required = 7;
}

message ImportStrategyRequest {
  string source_code = 1;
  string source_name = 2;
  string source_lang = 3;
  optional string workspace_id = 20;
}

message ImportStrategyResponse {
  string strategy_id = 1;
  string strategy_name = 2;
  string go_code = 3;
  double coverage_score = 4;
  repeated BlindSpot blind_spots = 10;
}

// ── Strategy Run lifecycle queries ───────────────────────────────────

message ListStrategyRunsRequest {
  string account_id = 1;  // optional filter by account
  int32 limit = 2;        // default 50, max 200
  int32 offset = 3;
}

message ListStrategyRunsResponse {
  repeated StrategyRun runs = 1;
}

message GetStrategyRunRequest {
  string run_id = 1;
}

message GetStrategyRunResponse {
  StrategyRun run = 1;
}

message StrategyRun {
  string id = 1;
  string user_id = 2;
  string account_id = 3;
  string symbol = 4;
  string timeframe = 5;
  string mode = 6;          // "live" | "paper"
  string status = 7;        // "running" | "stopped" | "error"
  string error = 8;
  int32 total_signals = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp stopped_at = 11;
}

// ── Active strategy monitoring ───────────────────────────────────────

message ListActiveStrategiesRequest {
  string account_id = 1;  // optional filter by account
}

message ListActiveStrategiesResponse {
  repeated ActiveStrategy strategies = 1;
}

message GetActiveStrategyRequest {
  string run_id = 1;
}

message GetActiveStrategyResponse {
  ActiveStrategy strategy = 1;
}

message StopStrategyRequest {
  string run_id = 1;
}

message StopStrategyResponse {
  bool success = 1;
  string error = 2;
}

message ActiveStrategy {
  string run_id = 1;
  string user_id = 2;
  string account_id = 3;
  string symbol = 4;
  string timeframe = 5;
  string mode = 6;          // "live" | "paper"
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp last_signal_at = 8;
  int32 signal_count = 9;
  int32 error_count = 10;
  string last_error = 11;
  string stderr_tail = 12;
}

// ── Strategy signal SSE stream ───────────────────────────────────────

message WatchStrategySignalsRequest {
  string run_id = 1;
}

message StrategySignalEvent {
  string run_id = 1;
  string account_id = 2;
  string symbol = 3;
  string signal_type = 4;
  string volume = 5;
  string price = 6;
  string stop_loss = 7;
  string take_profit = 8;
  string reason = 9;
  google.protobuf.Timestamp timestamp = 10;
}

// ── Strategy control ────────────────────────────────────────────────

message StartStrategyRequest {
  string account_id = 1;           // paper account ID or MT4/MT5 account ID
  string strategy_code = 2;
  string symbol = 3;
  string timeframe = 4;
  string mode = 5;                 // "live" | "paper"
  map<string, string> params = 6;  // strategy params
  repeated string extra_symbols = 7;  // secondary symbols for multi-symbol strategies
}

message StartStrategyResponse {
  bool success = 1;
  string run_id = 2;               // populated on success
  string error = 3;
}

// ── Active strategy watch stream ────────────────────────────────────

message WatchActiveStrategiesRequest {
  string account_id = 1;  // filter by account (empty = all)
}

message WatchActiveStrategiesEvent {
  repeated ActiveStrategy strategies = 1;
}

// ── Strategy version management ──────────────────────────────────────

message StrategyVersionInfo {
  string version_id = 1;
  int32 version_number = 2;
  string source_lang = 3;
  string change_summary = 4;
  string code_hash = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListStrategyVersionsRequest {
  string strategy_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListStrategyVersionsResponse {
  repeated StrategyVersionInfo versions = 1;
  int32 total = 2;
}

message GetStrategyVersionRequest {
  string strategy_id = 1;
  int32 version_number = 2;
}

message GetStrategyVersionResponse {
  StrategyVersionInfo version = 1;
  string source_code = 2;
}

message RollbackStrategyVersionRequest {
  string strategy_id = 1;
  int32 version_number = 2;
}

message RollbackStrategyVersionResponse {
  StrategyVersionInfo new_version = 1;
  string restored_source_code = 2;
}

message DiffStrategyVersionsRequest {
  string strategy_id = 1;
  int32 from_version = 2;
  int32 to_version = 3;
}

message DiffStrategyVersionsResponse {
  StrategyVersionInfo from_version = 1;
  string from_source_code = 2;
  StrategyVersionInfo to_version = 3;
  string to_source_code = 4;
}

message UpdateStrategyCodeRequest {
  string strategy_id = 1;
  string source_code = 2;
  string change_summary = 3;
}

message UpdateStrategyCodeResponse {
  StrategyVersionInfo new_version = 1;
}
