syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "strategy_template_entity.proto";

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated StrategyTemplate templates = 1;
}

message GetTemplateRequest {
  string id = 1;
}

message CreateTemplateRequest {
  string name = 1;
  string description = 2;
  string code = 3;
  repeated TemplateParameter parameters = 4;
  bool is_public = 5;
  repeated string tags = 6;
  // I18n data for parameter labels (JSON-encoded TemplateI18n).
  string i18n = 7;
  // FK to imported_strategies.id (ADR-0023).
  string strategy_id = 8;
}

message CreateTemplateDraftRequest {
  string name = 1;
}

message UpdateTemplateDraftRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string code = 4;
  repeated TemplateParameter parameters = 5;
  repeated string tags = 6;
  // FK to imported_strategies.id (ADR-0023).
  optional string strategy_id = 7;
}

message PublishTemplateDraftRequest {
  string id = 1;
}

message CancelTemplateDraftRequest {
  string id = 1;
}

message UpdateTemplateRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string code = 4;
  repeated TemplateParameter parameters = 5;
  optional bool is_public = 6;
  repeated string tags = 7;
  // I18n data for parameter labels (JSON-encoded TemplateI18n).
  optional string i18n = 8;
  // FK to imported_strategies.id (ADR-0023).
  optional string strategy_id = 9;
}

message DeleteTemplateRequest {
  string id = 1;
}
