syntax = "proto3";

package ant.v1;

option go_package = "anttrader/gen/proto/ant/v1;antv1";

import "google/protobuf/timestamp.proto";

message GetRiskConfigRequest { string user_id = 1; string account_id = 2; }
message RiskConfig { string id = 1; string user_id = 2; string account_id = 3; int32 max_positions = 4; string max_lot_size = 5; string max_daily_loss = 6; string daily_loss_used = 7; string max_drawdown_percent = 8; string max_risk_percent = 9; google.protobuf.Timestamp created_at = 10; google.protobuf.Timestamp updated_at = 11; }
message UpdateRiskConfigRequest { string user_id = 1; string account_id = 2; optional int32 max_positions = 3; optional string max_lot_size = 4; optional string max_daily_loss = 5; optional string max_drawdown_percent = 6; optional string max_risk_percent = 7; }
