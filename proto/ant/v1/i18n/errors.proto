syntax = "proto3";

package ant.v1.i18n;
option go_package = "alphaforge/gen/proto/ant/v1/i18n";

message ErrorsI18n {
  string account_already_bound = 1;  // This trading account is already linked
  string account_auth_failed = 2;  // Trading account authentication failed
  string account_connection_failed = 3;  // Failed to connect to trading server
  string account_disconnected = 4;  // Trading account disconnected
  string account_limit_exceeded = 5;  // Maximum number of trading accounts reached
  string account_not_connected = 6;  // Trading account is not connected
  string account_not_found = 7;  // Trading account not found
  string account_timeout = 8;  // Connection to trading server timed out
  string admin_access_denied = 9;  // Administrator access required
  string ai_internal_error = 10;  // AI service error. Please try again later.
  string ai_not_configured = 11;  // No AI provider configured yet. Please click ⚙ to set up an A
  string analytics_not_available = 12;  // Analytics data is not available
  string audit_log_not_found = 13;  // Audit log entry not found
  string broker_not_found = 14;  // Broker not found
  string broker_search_failed = 15;  // Failed to search for brokers
  string broker_server_unavailable = 16;  // Broker server is currently unavailable
  string cannot_close_position = 17;  // Cannot close this position
  string cannot_modify_order = 18;  // Cannot modify this order
  string email_not_verified = 19;  // Email not verified
  string forbidden = 20;  // Access denied
  string history_not_available = 21;  // Historical data is not available
  string insufficient_data = 22;  // Insufficient data for analysis
  string insufficient_margin = 23;  // Insufficient margin
  string internal = 24;  // Internal server error
  string invalid_account_type = 25;  // Unsupported account type
  string invalid_date_range = 26;  // Invalid date range
  string invalid_order_type = 27;  // Invalid order type
  string invalid_parameter = 28;  // Invalid parameter
  string invalid_password = 29;  // Invalid email or password
  string invalid_price = 30;  // Invalid order price
  string invalid_time_range = 31;  // Invalid time range
  string invalid_timeframe = 32;  // Invalid timeframe
  string invalid_volume = 33;  // Invalid trade volume
  string market_closed = 34;  // Market is currently closed
  string no_market_data = 35;  // No market data available
  string not_found = 36;  // Resource not found
  string old_password_incorrect = 37;  // Current password is incorrect
  string operation_forbidden = 38;  // This operation is not allowed
  string order_already_cancelled = 39;  // Order has already been cancelled
  string order_already_filled = 40;  // Order has already been filled
  string order_not_found = 41;  // Order not found
  string order_rejected = 42;  // Order was rejected
  string order_timeout = 43;  // Order execution timed out
  string password_too_weak = 44;  // Password must be at least 8 characters
  string platform_not_supported = 45;  // This trading platform is not supported
  string position_not_found = 46;  // Position not found
  string quote_not_available = 47;  // Quote is not available
  string rate_limited = 48;  // Too many requests. Please try again later.
  string report_generation_failed = 49;  // Failed to generate report
  string request_timeout = 50;  // Request timed out
  string service_unavailable = 51;  // Service temporarily unavailable
  string slippage_exceeded = 52;  // Price slippage exceeded tolerance
  string subscription_failed = 53;  // Failed to subscribe to market data
  string success = 54;  // Success
  string symbol_not_found = 55;  // Trading symbol not found
  string symbol_not_subscribed = 56;  // Symbol is not subscribed
  string token_expired = 57;  // Session expired. Please sign in again.
  string token_invalid = 58;  // Invalid session token
  string token_missing = 59;  // Authentication required
  string unauthorized = 60;  // Please sign in to continue
  string unknown = 61;  // An unknown error occurred
  string unsubscription_failed = 62;  // Failed to unsubscribe from market data
  string user_already_exists = 63;  // An account with this email already exists
  string user_disabled = 64;  // Account has been disabled
  string user_not_found = 65;  // User not found
}
