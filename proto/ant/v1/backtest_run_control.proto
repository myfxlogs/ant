syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

import "backtest_run.proto";

message CancelBacktestRunRequest {
  string run_id = 1;
}

message CancelBacktestRunResponse {
  BacktestRun run = 1;
}

message DeleteBacktestRunRequest {
  string run_id = 1;
}

message DeleteBacktestRunResponse {
  bool deleted = 1;
}

message DeleteBacktestRunsRequest {
  repeated string run_ids = 1;
}

message DeleteBacktestRunsResponse {
  int32 deleted_count = 1;
  int32 failed_count = 2;
}

message UpdateBacktestRunRequest {
  string run_id = 1;
  optional string name = 2;
}

message UpdateBacktestRunResponse {
  BacktestRun run = 1;
}
