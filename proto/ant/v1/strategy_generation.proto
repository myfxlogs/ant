syntax = "proto3";

package ant.v1;

option go_package = "anttrader/gen/proto/ant/v1;antv1";

// StrategyGenerationService handles AI-driven strategy creation from natural language.
// Phase 1 (spec/26): NL → clarification → template → code generation → compliance → auto-backtest.
service StrategyGenerationService {
  // GenerateStrategy orchestrates the full Phase 1 pipeline.
  // Returns a server-stream of chunks representing each pipeline phase.
  rpc GenerateStrategy(GenerateStrategyRequest) returns (stream GenerateStrategyChunk);
}

message GenerateStrategyRequest {
  string conversation_id = 1;     // existing conversation ID (optional, creates new if empty)
  string message = 2;             // user's natural language description
  string symbol = 3;              // optional, trading symbol for context
  string timeframe = 4;           // optional, timeframe for context
  string template_id = 5;         // optional, user-selected template override
  int32 clarification_round = 6;  // current clarification round (0 = first, max 3)

  // Phase 3: feedback context (all optional — absent = fresh mode)
  string previous_code = 9;           // previous strategy code (for feedback iteration)
  string backtest_metrics_json = 10;  // serialized backtest metrics (FeedbackMetrics JSON)
  string feedback_message = 11;       // user's feedback text (e.g. "太激进了")
}

// GenerateStrategyChunk is a single streaming event in the generation pipeline.
message GenerateStrategyChunk {
  string phase = 1;                    // clarifying | generating | compliance | backtest | done
  string delta = 2;                    // streaming text delta (generating phase)
  repeated string questions = 3;       // clarification questions (clarifying phase)
  string code = 4;                     // final generated Python code (generating or compliance phase)
  repeated string compliance_issues = 5; // compliance scan issues (compliance phase)
  string backtest_run_id = 6;          // auto-triggered backtest ID (backtest phase)
  string template_name = 7;            // matched template name (generating phase)
  string error = 8;                    // non-fatal error message

  // Phase 3: structured feedback output
  string analysis = 9;                 // AI analysis paragraph (feedback mode)
  string advice = 10;                  // AI advice paragraph (feedback mode)
}
