syntax = "proto3";

package ant.v1;

import "google/protobuf/struct.proto";

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

// NotificationService is the user-facing in-app notification inbox.
// Supports list, mark-read, SSE streaming, and server-side notification creation.
service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
  rpc StreamNotifications(StreamNotificationsRequest) returns (stream Notification);
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  // Phase 3.4: Notification preferences.
  rpc GetNotificationPrefs(GetNotificationPrefsRequest) returns (GetNotificationPrefsResponse);
  rpc SetNotificationPrefs(SetNotificationPrefsRequest) returns (SetNotificationPrefsResponse);
}

message StreamNotificationsRequest {
  bool unread_only = 1;  // when true, only stream unread notifications
}

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;          // margin_call | risk_alert | system | trade
  string title = 4;
  string message = 5;
  google.protobuf.Struct data = 6;  // structured metadata
  bool is_read = 7;
  string created_at = 8;    // RFC 3339
}

message ListNotificationsRequest {
  int32 limit = 1;          // default 50
  int32 offset = 2;         // default 0
  bool unread_only = 3;     // default false
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total_unread = 2;
}

message MarkReadRequest {
  string id = 1;
}

message MarkReadResponse {}

message MarkAllReadRequest {}

message MarkAllReadResponse {}

message SendNotificationRequest {
  string user_id = 1;
  string type = 2;     // backtest_completed | tuning_completed | gate_passed | signal_triggered | system_alert
  string title = 3;
  string message = 4;
  google.protobuf.Struct data = 5;  // optional structured metadata
}

message SendNotificationResponse {
  string id = 1;        // created notification id
}

// ── Phase 3.4: Notification Preferences ──────────────────────────────────────

message GetNotificationPrefsRequest {}

message GetNotificationPrefsResponse {
  bool new_strategy_enabled = 1;
  bool price_change_enabled = 2;
  bool sub_expiring_enabled = 3;
  bool performance_alert_enabled = 4;
  bool new_rating_enabled = 5;
}

message SetNotificationPrefsRequest {
  bool new_strategy_enabled = 1;
  bool price_change_enabled = 2;
  bool sub_expiring_enabled = 3;
  bool performance_alert_enabled = 4;
  bool new_rating_enabled = 5;
}

message SetNotificationPrefsResponse {}
