syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

message DiscoverSystemAIModelsRequest {
  string provider_id = 1;
}
message DiscoverSystemAIModelsResponse {
  string provider_id = 1;
  repeated string models = 2;
  string default_model = 3;
}

message ValidateSystemAIConnectionRequest {
  string provider_id = 1;
}
message ValidateSystemAIConnectionResponse {
  string provider_id = 1;
  bool ok = 2;
  int32 model_count = 3;
}

message ParseProviderCurlRequest {
  // Raw curl command pasted from vendor docs (may span multiple lines).
  string curl = 1;
  // Provider already has a stored key — key-related warnings are muted
  // (the saved key keeps working; the example never carries it anyway).
  bool has_saved_key = 2;
}
message ParseProviderCurlResponse {
  string base_url = 1;       // API root, endpoint suffix stripped
  string api_key = 2;        // empty when absent or a {your_key}-style placeholder
  string default_model = 3;  // "model" from the JSON body
  repeated string models = 4;
  string name_hint = 5;      // display-name hint derived from the URL host
  repeated string warnings = 6; // human-readable notes for the user to review
}
