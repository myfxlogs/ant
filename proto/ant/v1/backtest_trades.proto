syntax = "proto3";

package ant.v1;

option go_package = "alphaforge/gen/proto/ant/v1;antv1";

service BacktestTradesService {
  rpc ListBacktestRunTrades(ListBacktestRunTradesRequest) returns (ListBacktestRunTradesResponse);
}

message ListBacktestRunTradesRequest {
  string run_id = 1;
}

message ListBacktestRunTradesResponse {
  repeated BacktestTrade trades = 1;
  BacktestTradeSummary summary = 2;
}

message BacktestTrade {
  int64 ticket = 1;
  string side = 2;
  string volume = 3;
  int64 open_ts = 4;
  string open_price = 5;
  int64 close_ts = 6;
  string close_price = 7;
  string pnl = 8;
  string commission = 9;
  string reason = 10;
}

message BacktestTradeSummary {
  int32 count = 1;
  int32 wins = 2;
  int32 losses = 3;
  string net_pnl = 4;
}
