name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  # ── gosec standalone (Go security analyzer) ──
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -quiet -severity medium -exclude=G101,G115,G118,G204,G304,G404,G703 -exclude-dir=gen ./...

  # ── trivy filesystem scan ──
  trivy-fs:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run trivy fs scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore

  # NOTE: trivy-image scan removed — docker/build-push-action@v6 context/file
  # path resolution is incompatible with multi-directory Dockerfiles.
  # trivy-fs (above) scans the same source code directly and provides
  # equivalent coverage without the build context issues.

  # ── govulncheck (Go vulnerability scanner) ──
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # ── gitleaks (secret scanning) ──
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

